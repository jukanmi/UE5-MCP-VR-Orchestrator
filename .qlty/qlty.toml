config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# ── 오탐 억제 (2026-09-13 전수 분석 결과 반영) ──────────────────────────
# tests/ 의 assert 는 pytest 관용구
[[ignore]]
rules = ["bandit:B101"]
file_patterns = ["**/tests/**"]

# random 은 NPC 확률 행동·데이터 셔플용, 암호 용도 아님
[[ignore]]
rules = ["bandit:B311"]

# finetune 스크립트의 urlopen 은 localhost Ollama 고정 URL
[[ignore]]
rules = ["bandit:B310"]
file_patterns = ["**/finetune/**"]

# 테스트 고정 토큰 문자열
[[ignore]]
rules = ["bandit:B105", "bandit:B106", "bandit:B107"]
file_patterns = ["**/tests/**"]

# tools/ 는 개발자 로컬 CLI — subprocess 호출이 본업
[[ignore]]
rules = ["bandit:B404", "bandit:B603", "bandit:B607"]
file_patterns = ["tools/**"]
