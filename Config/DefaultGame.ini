; ─────────────────────────────────────────────────────────────────────────────
; OmniAgent 네트워크 설정
; WHY: 서버 주소·인증 토큰을 소스코드에 하드코딩하지 않는다.
;   - AuthToken 은 Python .env 의 WS_AUTH_TOKEN 과 반드시 일치해야 한다.
;   - ServerHost 는 LLM·TTS WebSocket 공통 호스트.
;     데스크톱 테스트는 127.0.0.1, Quest 스탠드얼론 빌드는 PC 의 LAN IP 로 교체.
;     (Quest 와 PC 가 같은 Wi-Fi 여야 함)
; ─────────────────────────────────────────────────────────────────────────────
[OmniAgent]
AuthToken=omniagent-dev-secret-changeme-before-production
ServerHost=127.0.0.1
LLMPort=8000
TTSPort=8001

