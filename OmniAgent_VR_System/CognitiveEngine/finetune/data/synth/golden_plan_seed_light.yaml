- id: plan_light_001
  npc: Skadi
  source_goal_en: "eat meat"
  context: |
    제단에서 발견된 샘플을 획득하기 위해, Skadi는 왕실의 수호견에게 감자(potato)를 전달하여 주의를 분산시킨다.
  gold:
    goal: "샘플을 확보하고 안전하게 이동"
    steps:
      - "제단으로 이동하여 샘플 확인"
      - "왕실 수호견에게 감자를 전달하여 주의를 분산시키고, 왕실의 사유물인 샘플을 획득"
      - "해외 상인의 선박으로 이동하여 샘플을 운송"

