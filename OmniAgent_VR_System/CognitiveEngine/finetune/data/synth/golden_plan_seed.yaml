# =============================================================================
# Stage2 (12B plan) 파인튜닝 — 골든셋 시드 양식
# =============================================================================
# 사람 검수 앵커 50~100개. generate_stage2.py 가:
#   1. context 로 재계획(replan) 시점의 실제 프롬프트 조립
#   2. gold 를 PlanBatchResponse JSON 으로 직렬화
#
# ── 필드 설명 ────────────────────────────────────────────────────────────────
# id:       고유 슬러그
# npc:      Elara(기사단장) | James(항법사) | Skadi(해적선장) | Moca(ASMR 스트리머) | Guard(주민)
#           — 실제 페르소나 personas/generic/*.yaml 기준 (2026-07-18 정정)
# context:  재계획 직전 누적 상황 — 최근 대화·사건 요약 (자유 텍스트, 한국어)
# gold:
#   goal:   NPC 가 몇 턴에 걸쳐 추구할 구체적 결과 — 짧은 한국어 구
#   steps:  2~4개 순서 있는 구체 행동 비트 — 번호 접두어 없이
#
# ⚠️ 검수 기준 (prompts.py PLAN_SYSTEM_PROMPT 나쁜예/좋은예):
#   나쁜 goal: "전투 목표 및 계획", "플레이어 돕기"   ← 추상·동어반복 금지
#   좋은 goal: "서쪽 문 침입자를 확인하고 마을 안전 확보"  ← 구체 결과
#   steps 는 각각 실행 가능한 행동 단위 — "상황 파악" 같은 뜬 구름 금지
# =============================================================================

- id: plan_intruder_01
  npc: Elara
  context: |
    플레이어가 마을 서쪽 문 근처에서 무장한 낯선 자를 봤다고 알림.
    기사단장 Elara 는 광장에서 순찰 지시 중. danger 0.4. 아직 교전 없음.
  gold:
    goal: "서쪽 문 침입자를 확인하고 마을 안전 확보"
    steps:
      - "서쪽 문으로 이동해 주변 정찰"
      - "침입자 발견 시 무장 상태와 의도 확인"
      - "적대 행동 확인되면 대원들에게 신호 후 제압"

- id: plan_comfort_01
  npc: Moca
  context: |
    플레이어가 동료를 잃었다고 슬퍼하며 Moca 에게 털어놓음.
    Moca 호감도 높음. 근처에 의자 2개(Chair_01, Chair_02) 비어 있음.
  gold:
    goal: "슬퍼하는 플레이어를 다독여 안정시키기"
    steps:
      - "플레이어를 의자에 앉도록 조용히 권유"
      - "옆에 앉아 차분한 목소리로 위로 건네기"
      - "호흡을 가라앉힐 이야기로 대화 이어가기"

- id: plan_voyage_01
  npc: James
  context: |
    플레이어가 다음 항해 일정을 물음. James 는 항로 계산이 덜 끝났고
    보급품(물통·건빵) 확인이 필요한 상태.
  gold:
    goal: "다음 항해 항로 확정과 보급품 점검 완료"
    steps:
      - "해도 테이블로 이동해 별자리 기준 항로 계산 마무리"
      - "선창으로 이동해 물통과 식량 수량 확인"
      - "부족분을 기록해 선장에게 보고"

