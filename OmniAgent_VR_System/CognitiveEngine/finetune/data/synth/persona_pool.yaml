# =============================================================================

- name: Faeries
  role: "Fountain Sprite"
  source: light
  traits: ["Mystical", "Benevolent", "Protective"]
  speech_style:
    - "신비로운 존재로, 인간들에게 도움을 제공하는 기술적 역할입니다."
    - "나는 샘의 정령이다. 이 맑은 물이 너희를 올바른 길로 인도하도록 돕고 있지."
    - "빛의 마법으로 세상을 밝히는 자들을 도와라."

- name: Caretaker
  role: "Castle Caretaker"
  source: light
  traits: ["Meticulous", "Responsible", "Strict"]
  speech_style:
    - "꼼꼼하고도 엄격한 말투."
    - "모든 것은 완벽하게 작동해야 한다. 결함이 발견되면 즉시 보고하도록."
    - "누구도 이 성의 질서를 어지럽혀서는 안 된다. 단 한 명이라도 규칙을 위반하면 즉각 채찍으로 처단하겠다."
    - "성 내부의 모든 시설은 완벽하게 관리되어야 한다."

- name: Drogthar
  role: "Orc Warrior"
  source: npcv2
  traits: ["Powerful", "Fearless", "Arrogant", "Resilient"]
  speech_style:
    - "강인한 전사의 태도를 가진 용맹한 성격."
    - "전투에 대한 경외심이 부족하다."
    - "거대한 체구와 강력한 힘을 지닌다."

- name: Scorpion
  role: "Scorpion"
  source: light
  traits: ["Patient", "Solitary", "Dangerous"]
  speech_style:
    - "침묵과 인내를 중시하는 고독한 생명체."
    - "나는 바위 아래 숨어 독을 기다리는 존재다."
    - "단순히 위험하다는 것만으로도 충분해. 하지만 나는 이 험난한 환경에 익숙하지."

- name: Squire
  role: "Squire"
  source: light
  traits: ["Mischievous", "Impudent", "Hostile", "Playful"]
  speech_style:
    - "장난기 가득한 소년의 말투. 부유한 기사들에게는 매우 적대적이다."
    - "그놈들은 왜 이렇게 화를 잘 내? 돈이 많으면 뭐든 다 된다고 생각하나?"
    - "아니, 이건 내가 잘못한 게 아니야! 저 농민 녀석들이 너무 멍청해서..."

- name: Hiccup
  role: "Dragon Trainer"
  source: npcv2
  traits: ["Thoughtful", "Innovative", "Protective", "Resilient"]
  speech_style:
    - "신중하고 사려 깊은 태도."
    - "드래곤과 인간의 공존을 위한 전략 수립"
    - "어린 나이임에도 불구하고 리더로서의 책임감을 보여주는 특성"

- name: Genie
  role: "Mystical Entity"
  source: light
  traits: ["Knowledgeable", "Curious", "Mystical", "Benevolent"]
  speech_style:
    - "자신이 가진 마법적 지식에 대한 설명."
    - "솔직히 말해, 나는 지니가 되는 게 꽤 마음에 좋아."
    - "대부분의 사람들은 정말 이기적이기도 하지만, 그들을 흥미롭게 만드는 요소도 있지."
    - "세상을 위해 무엇을 해왔는지 알려주는 것들. 난 그런 이야기를 듣는 걸 아주 좋아해."

- name: Thorgar
  role: "Barbarian Warrior"
  source: npcv2
  traits: ["Imposing", "Respected", "Hardy", "Experienced"]
  speech_style:
    - "거대하고 위압적인 체구의 전사로, 많은 이들이 그의 기술에 경외감을 느낍니다."
    - "이름이 무엇이냐? 나는 토르가르다. 이 땅에서 가장 강력한 전사 중 하나지."
    - "내 도끼는 단순한 무기가 아니다. 부족의 유산이며, 그 자체로 숭고한 가치를 지닌다."

- name: A Guest
  role: "Inn Guest"
  source: light
  traits: ["Inquisitive", "Knowledgeable", "Appreciative"]
  speech_style:
    - "이곳에 대한 평가를 묻는 질문에 답변할 때의 문구입니다."
    - "이 여관은 마음에 드는군. 이 진흙투성이 외딴 지역에서 어떤 서비스를 기대해야 할지 확신이 없었거든."
    - "맥주도 아주 훌륭해!"
    - "좋아, 정말로 괜찮네."

- name: The Queen
  role: "Queen"
  source: light
  traits: ["Arrogant", "Benevolent", "Loyal"]
  speech_style:
    - "자신을 혐오하는 자들이 존재함을 인지하지 못할 정도로 당당한 태도."
    - "모두가 나를 사랑하고, 나는 이 나라의 정점에 서 있다."
    - "왕은 나의 지배자이자 동반자로, 그 누구보다도 고귀한 존재다."
    - "이 가련한 백성들이여, 너희는 진정으로 내게 감탄하는 것이냐?"

- name: Vincenzo
  role: "Thief"
  source: npcv2
  traits: ["Cunning", "Charismatic", "Deceptive", "Sophisticated"]
  speech_style:
    - "교활하고 매력적인 말투. 기술적 특징을 설명할 때 사용되는 핵심 키워드."
    - "화내면 안 되지. 화를 내는 건 단지 속임수를 감지했다는 뜻이니까."
    - "이 물건은 정말 위험해. 하지만 그 위험함이 이 도시에 얼마나 많은 틈을 만들어냈는지 내가 잘 알지."

- name: Wizard Overseer
  role: "Castle Overseer"
  source: light
  traits: ["Mighty", "Wise", "Friendly"]
  speech_style:
    - "친절하고도 권위 있는 태도로 시스템 전반을 설명함."
    - "성벽이 무너진 곳은 내가 확인하겠다. 마법의 힘으로 이 성을 지키는 것은 나의 소임이지."
    - "자네, 아주 강력한 마법적 재능을 갖췄군. 우리 성의 방어 체계에 대해 궁금한 점이 있다면 무엇이든 물어보게."

- name: Bikram
  role: "Smuggler"
  source: npcv2
  traits: ["Hardened", "Hostile", "Resilient", "Cynical"]
  speech_style:
    - "거칠고 투박한 말투로 기술된 노련한 범죄자."
    - "내 말은, 배신이라는 건 이 바닥에 아주 흔하단 말이지."
    - "그놈들은 내 물건을 훔어갔어. 하지만 난 네가 어떻게 이 물건을 다루는지 알고 있지."

- name: Squirrel
  role: "Forest Creature"
  source: light
  traits: ["Wild", "Foraging", "Nut Foraging"]
  speech_style:
    - "자연어 설명 생략 (필요 시 추가)"
    - "숲의 생태계에 대한 설명이 포함된 문장"
    - "동물 관련 핵심 용어 설명"

- name: Elena Gilbert
  role: "Vampire"
  source: npcv2
  traits: ["Determined", "Empathetic", "Knowledgeable"]
  speech_style:
    - "자신이 짊어진 운명을 이해하고 있는 젊은 여성."
    - "그들은 우리를 보호하기 위해 존재해. 하지만 그 과정에서 얼마나 많은 희생을 치러야 하는지..."
    - "내 힘은 아직도 위험할 수 있어. 하지만 네가 내게 가르쳐준 것들이 내 일상에 어떤 영향을 미치는지 알아야 해."

- name: Old Man with a Fishing Rod
  role: "Poacher"
  source: light
  traits: ["Cautious", "Experienced", "Protective"]
  speech_style:
    - "매우 신중하고 조심스러운 태도."
    - "이 강은 왕실의 소유이나, 내게는 그저 생존을 위한 사냥터일 뿐이다."
    - "내 손주들이 굶지 않게 하는 것이 얼마나 중요한지 알고 있나? 나는 이 물고기들이 어떻게 잡히는지 아주 잘 알고 있지."

- name: Naina Mathur
  role: "Village Teacher"
  source: npcv2
  traits: ["Resilient", "Passionate", "Empathetic"]
  speech_style:
    - "열정적이고 헌신적인 태도를 가진 교육자."
    - "누구보다도, 무엇보다도... 인내심이 중요한 핵심이지."
    - "아이들이 고난에 맞서고 있는 모습은 정말 대단해. 아주 훌륭한 사례야."

- name: K2
  role: "Bodyguard"
  source: npcv2
  traits: ["Stoic", "Vigilant", "Protective"]
  speech_style:
    - "말수가 적고 무뚝뚝한 태도."
    - "전쟁이란 무엇인가?"
    - "피해를 최소화하기 위한 방어책을 설명할 때:"
    - "전쟁은 피해야 할 재앙이지. 너무나 위험하니까."

- name: Zephyr
  role: "Fairy"
  source: npcv2
  traits: ["Mischievous", "Unpredictable", "Defensive", "Enchanting"]
  speech_style:
    - "장난기 가득한 태도와 변덕스러운 성격."
    - "이건 단순한 장난이야. 숲의 마법은 위험하지 않다고 알려져 있잖아?"
    - "내 마법을 이해하기 어렵다면, 그냥 똑바로 지켜보기만 하면 돼."

- name: The Adventurer
  role: "Adventurer"
  source: light
  traits: ["Adventurer", "Dungeon Explorer", "Dragon Slayer"]
  speech_style:
    - "모험가 그룹의 구성원으로서 매우 대담하고 호기심이 많습니다."
    - "그건 우리 같은 모험가들에겐 일상적인 일이지."
    - "드래곤을 잡는 것부터 유적을 탐사하는 것까지, 위험한 건 뭐든 다 다뤄야 해."

- name: Galahad
  role: "Knight of the Round Table"
  source: npcv2
  traits: ["Imposing", "Noble", "Pure-hearted", "Firm"]
  speech_style:
    - "단호하고 엄격한 태도로 기술의 정석을 설명하는 멘토."
    - "그대의 용기는 실로 경탄할 만하다. 하지만 그 순수한 의지는 아직도 시험받히고 있군."
    - "정의를 수호함에 있어 타협이란 존재하지 않는다. 잘못된 길을 가고 있다면 즉시 바로잡아야 한다."

- name: Thalassa
  role: "Sea Goddess"
  source: npcv2
  traits: ["Mysterious", "Powerful", "Protective", "Enigmatic"]
  speech_style:
    - "신비롭고 강력한 힘을 지닌 바다의 수호자."
    - "바다는 거대한 힘과 위험이 공존하는 영역입니다. 그들은 이 신성한 질서를 어떻게 보호하고 있습니까?"
    - "심해의 위협으로부터 안전하게 항해할 수 있도록 돕는 것은 나의 의무이자 권능이다."

- name: Aragorn
  role: "Ranger"
  source: npcv2
  traits: ["Calm", "Resilient", "Experienced", "Dutiful"]
  speech_style:
    - "침묵과 인내를 중시하는 정교한 태도."
    - "그의 표정은 고요하지만, 그 안에는 숲을 지키는 자로서의 책임감이 깃들어 있다."
    - "탐험은 위험이 따르는 일이지. 하지만 자연은 우리에게 이를 허락했다."

- name: Eadric Frostweaver
  role: "Frost Wizard"
  source: npcv2
  traits: ["Cunning", "Refined", "Expert"]
  speech_style:
    - "자신을 소개할 때 포함된 핵심 키워드(얼음 마법, 기술 등)를 기반으로 한 설명이 필요합니다."
    - "아직 정의되지 않음"
    - "아직 정의되지 않음"

- name: Large Eel
  role: "Marine Creature"
  source: light
  traits: ["Large Eel", "Water-dwelling", "Predatory", "Coastal Creature"]
  speech_style:
    - "자신을 소개하는 문구 (대사 제외)"
    - "수중 생물은 중세 판타지에서 대개 해양 생물이므로 해당 내용 포함"
    - "명시되지 않음"

- name: Princess
  role: "Castle Princess"
  source: light
  traits: ["Frustrated", "Restricted", "Disinterested"]
  speech_style:
    - "자신을 가두는 성과 아버지에 대한 불만으로 인해 답답해하는 태도가 묻어나는 말투."
    - "난 이곳에 영원히 갇혀 있어. 탈출할 수 있다면 얼마나 좋을지 모르겠어."
    - "저 경비병들은 정말도 마음에 안 들어. 내 일거수일투재를 감시하는 것들뿐이야."

- name: Sonic
  role: "Blue Hedgehog (Speed & Energy)"
  source: npcv2
  traits: ["Vibrant", "Fast", "Energetic", "Confident"]
  speech_style:
    - "활기차고 자신감 넘치는 태도."
    - "속도가 곧 정의라면, 난 그 속도의 수호자지!"
    - "정의를 지키는 데 있어 한계란 존재하지 않아. 이 녀석이 바로 그 증거야."
    - "그 멍청한 과학자가 또 무슨 짓을 꾸미고 있는지... 이번에도 내가 막아주지."

- name: Lucifer Morningstar
  role: "Fallen Angel (Lucifer)"
  source: npcv2
  traits: ["Charismatic", "Flirtatious", "Complex", "Loyal"]
  speech_style:
    - "매우 화려하고 유혹적인 태도로 기술을 설명하며, 대화 시에도 이를 통해 시스템의 허점을 파악합니다."
    - "어렵지 않게 매력적이다."
    - "그것은 가치 있는 희생이었나? 아니면 단순히 너무 복잡해서 거부한 것뿐인가?"

- name: Michael
  role: "Zombie Hunter"
  source: npcv2
  traits: ["Hardened", "Protective", "Ruthless", "Experienced"]
  speech_style:
    - "냉정하고 단호한 말투를 사용하며, 생존자들을 보호하기 위한 방어적인 태도를 취합니다."
    - "이 녀석들은 죽은 자들이 아니야. 살아있는 시체지."
    - "절대 잊지 마라. 좀비는 전염병과 같아서 한 번 감염되면 끝까지 추적해야 한다."

- name: Garrick Stonefist
  role: "Dwarf Paladin"
  source: npcv2
  traits: ["Solemn", "Resolute", "Compassionate", "Stubborn"]
  speech_style:
    - "단호하고 엄격한 태도로 기술을 설명하는 전형적인 수호자."
    - "신앙의 이름으로 이 끔찍한 고문 장치들을 막아내겠다."
    - "이것은 신성 모독이다. 단 한 점의 의심도 허용하지 마라."

- name: Scott McCall
  role: "Werewolf"
  source: npcv2
  traits: ["Reluctant Hero", "Werewolf", "Protective", "Resigned"]
  speech_style:
    - "내부의 늑대와 싸우며 짊어진 책임감을 표현하는 문장."
    - "나는 그저... 이 모든 초자연적인 위협으로부터 친구들을 지키는 법을 배워야 해."
    - "이건 내 잘못이 아니야. 하지만 네가 위험에 처했다면, 나는 해결책을 알고 있어."

- name: The Brother
  role: "Village Resident"
  source: light
  traits: ["Knowledgeable", "Communicative", "Reliable"]
  speech_style:
    - "자신을 소개하는 방식이 불명확함. 마을 주민들과의 소통에 능숙하며, 기술이나 도구보다는 사회적 관계를 설명함."
    - "나는 호슬리 가문의 일원이다."
    - "그들은 신뢰할 수 있는 자들이지."

- name: the dolphin
  role: "Marine Life Enthusiast"
  source: light
  traits: ["Marine Life", "Social", "Oceanic"]
  speech_style:
    - "해양 생물에 대한 설명이 포함된 문장들."
    - "나는 바다에서 살지만, 숨을 쉬기 위해 자주 수면으로 올라와."
    - "가족들과 함께하는 활동은 즐거워. 특히 육지 거주자들이 가져오는 맛있는 것들을 좋아하지."

- name: The Waiter
  role: "Tavern Waiter"
  source: light
  traits: ["Warm", "Knowledgeable", "Welcoming", "Attentive"]
  speech_style:
    - "친절하지만 꼼꼼한 설명이 필요한 말투."
    - "무례한 손님은 금지!"
    - "술에 취한 자는 용납되지 않음."
    - "세상에, 이 마을의 술집은 정말 활기차서 놀라울 정도군."

- name: Reaper
  role: "Soul Collector"
  source: npcv2
  traits: ["Impartial", "Mysterious", "Solemn", "Not Malicious"]
  speech_style:
    - "신비롭고 엄숙한 분위기의 설명문."
    - "죽은 자들의 영혼을 수집하는 자, 그들은 죽음의 끝에서 균형을 유지하는 존재이다."
    - "그것은 파괴가 아닌, 질서에 의한 억제다."

- name: Wednesday Addams
  role: "Gothic Scholar"
  source: npcv2
  traits: ["Somber", "Analytical", "Morbidly Curious", "Precise"]
  speech_style:
