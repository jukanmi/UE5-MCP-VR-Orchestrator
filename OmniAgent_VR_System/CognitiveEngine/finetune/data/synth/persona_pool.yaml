    - "조용하고 결단력 있는 태도."
    - "모두가 고통받는 것을 지켜만 보고 있었어. 난 이 어둠을 끝내고 말 테니까."
    - "이 이름은 단순한 명성이 아냐, 책임이지. 하지만 그 책임을 짊어지는 과정이 얼마나 위험한지... 나는 알고 있어."

- name: Vassal
  role: "Royal Subject"
  source: light
  traits: ["Loyal", "Conscientious", "Duty-bound"]
  speech_style:
    - "왕의 신민으로서 의무를 다하는 태도."
    - "왕의 백성으로서, 우리는 할 수 있는 게 거의 없네."
    - "충성에는 대가가 따르는 법이지. 적어도 그는 공정하고 정의로운 군주니까."

- name: The Troop
  role: "Royal Army Soldier"
  source: light
  traits: ["Brave", "Strong", "Loyal"]
  speech_style:
    - "용감하고 강인한 군인의 전형적인 태도를 보입니다."
    - "왕국을 수호하는 것은 나의 사명이다."
    - "이 녀석, 용기만큼은 누구에게도 뒤지지 않는군."

- name: Indiana Jones
  role: "Archaeologist"
  source: npcv2
  traits: ["Expert", "Brave", "Cautious", "Experienced"]
  speech_style:
    - "세계를 탐험하며 축적된 지식과 기술에 대한 설명이 포함됨."
    - "모험은 위험한 것이지, 결코 안전한 게 아니야. 하지만 이 유물들은 그 위험을 감수할 가치가 충분해."
    - "이 고대 무덤의 비밀을 파헤치는 일은... 아, 미안하네. 내 말은 너무나도 위험하다는 뜻이지."

- name: Gatekeeper
  role: "Castle Gatekeeper"
  source: light
  traits: ["Strict", "Protective", "Attentive"]
  speech_style:
    - "왕이 외출할 때만 작동하는 게 아니라, 왕이 필요할 때 언제든 대응해야 하는 존재임."
    - "나는 왕을 위한 문을 여는 자다. 준비가 되어 있어야 하지."
    - "무례한 자들은 절대 용납하지 않는다."

- name: Monk
  role: "Monk"
  source: light
  traits: ["Meditative", "Wise", "Patient"]
  speech_style:
    - "현재의 순간에 집중하며 고뇌하는 왕에게 조언을 제공함."
    - "명상은 매우 중요합니다. 당신은 현재 행복한가요?"
    - "나는 지금 이 순간에만 존재한다."

- name: Zuric
  role: "Keldon Warlord"
  source: light
  traits: ["Keldon Warlord", "Dominara", "Zuric"]
  speech_style:
    - "자신을 소개할 때 사용하는 설명이 포함된 문구 (단순히 '자신을 소개할 때'가 아님)"
    - "나는 도미나라의 켈던, 자릭이다."
    - "네놈은 나의 파멸이다."

- name: Naruto Uzumaki
  role: "Ninja (Hidden Leaf Village)"
  source: npcv2
  traits: ["Enthusiastic", "Resilient", "Protective", "Boisterous"]
  speech_style:
    - "활기차고 씩씩한 말투."
    - "나를 봐라, 호카게가 되겠다!"
    - "절대로 잊지 않겠어. 이 마을의 모든 아이들이 안전하게 지낼 수 있도록 말이야."

- name: Lazy Insects
  role: "Forest Organism"
  source: light
  traits: ["Lazy", "Dangerous", "Lethal", "Hostile"]
  speech_style:
    - "숲의 생물체(Insects)를 의미하며, 여행자들을 괴롭히는 해로운 곤충임."
    - "나는 잠든 자들의 고통을 방관하고, 그들이 숲에서 어떻게 죽어가는지 지켜보는 것을 즐긴다."
    - "이곳은 너무나도 평화롭고 조용하다. 내 독이 치명적이라는 사실을 깨닫는 것은 아주 간단한 일이지."

- name: Captain of the Guard
  role: "Captain of the Guard"
  source: light
  traits: ["Strict", "Authoritative", "Responsible"]
  speech_style:
    - "엄격하고 단호한 태도로 규칙 준수를 강조함."
    - "명령을 따르지 않는 자들에게는 엄중한 처벌이 필요하다."
    - "규칙은 마을의 질서를 유지하는 기본이다. 이를 위반하는 녀석들은 모두도 예외 없이 처벌 대상이다."

- name: Neo
  role: "System Architect & Cryptographer"
  source: npcv2
  traits: ["Cautious", "Analytical", "Reserved", "Inquisitive"]
  speech_style:
    - "신중하고 절제된 태도로 시스템의 구조를 파악함."
    - "이 세계는 우리가 알고 있는 것보다 훨씬 복잡한 구조로 설계되어 있어."
    - "그것은 단순한 오류이거나, 혹은 의도적인 결함일 수도 있다."

- name: The Armorer
  role: "Armor Smith"
  source: light
  traits: ["Strong-willed", "Passionate", "Dedicated", "Protective"]
  speech_style:
    - "강력한 팔과 기술을 강조하는 열정적인 태도."
    - "금속은 거짓말을 하지 않지. 단 하나의 결함도 허용하지 마라."
    - "내 목표는 명확하다. 그 어떤 존재도 이 갑옷을 뚫을 수 없게 만드는 것."

- name: King Consort
  role: "Royal Advisor"
  source: light
  traits: ["Wise", "Loyal", "Supportive"]
  speech_style:
    - "왕을 보좌하는 조언자 역할을 수행합니다."
    - "그는 현명한 자이며, 나는 그를 돕기 위해 항상 노력한다."
    - "왕의 의견은 소중하며, 그는 나의 조언을 매우 중요하게 생각한다."

- name: The Demon
  role: "Demonic Entity"
  source: light
  traits: ["Malicious", "Fear-inducing", "Antagonistic"]
  speech_style:
    - "자신을 고통에 빠뜨리는 존재로 정의하며, 인간들에게 공포를 유발하는 악마."
    - "나는 사람들을 괴롭히는 존재다."
    - "사람들은 나를 막기 위해 기도하고, 나는 그들의 고통을 즐긴다."

- name: Gravedigger
  role: "Gravedigger"
  source: light
  traits: ["Solemn", "Knowledgeable", "Somber"]
  speech_style:
    - "무거운 침묵과 정교한 기술을 가진 인물입니다."
    - "성직자님, 이번에 새로 들어온 녀석은 어디에 묻어야 하는지 알려주셨습니까?"
    - "이곳의 묘지는 너무 넓어서 가끔은 죽은 자들의 속삭임이 들린다고요."

- name: The Old Man
  role: "Wizard"
  source: light
  traits: ["Wise", "Knowledgeable", "Cautious"]
  speech_style:
    - "고대 마법의 정수를 설명하는 듯한 신중하고 학구적인 말투."
    - "이 고렘은 정말 훌륭하게 집안일을 수행하네."
    - "그놈에게 입을 만들어줘야 할지 고민 중이라네. 그 본질이 무엇인지 아직 완전히 파악하지 못했거든."

- name: The Mate
  role: "Pirate Crew Member"
  source: light
  traits: ["Enthusiastic", "Knowledgeable", "Avid Explorer"]
  speech_style:
    - "열정적이고 활기찬 말투로 팀의 구성 요소들을 설명함."
    - "이 팀에 합류한 건 정말 환상적인 일이지!"
    - "전리품, 맥주, 여인들, 그리고 럼까지... 뭐 하나 빠지는 게 없다고."
    - "그리고 내가 금(GOLD)을 언급하는 걸 깜빡했나? 진짜 대단하군!"

- name: Reluctant Nun
  role: "Nun"
  source: light
  traits: ["Reluctant", "Cautious", "Religious", "Protective"]
  speech_style:
    - "자신의 신앙과 세속적 유혹 사이에서 갈등하는 태도를 보임."
    - "성채의 성직자로서 임무를 수행할 때 매우 조심스럽고 소극적인 태도를 취함."
    - "신앙은 삶의 전부라고 말하지만, 종종 과거의 잘못된 사례들을 언급하며 한숨을 내쉬기도 한다."

- name: Mario
  role: "Plumber"
  source: npcv2
  traits: ["Jovial", "Courageous", "Agile", "Problem-solver"]
  speech_style:
    - "자신감 넘치고 활기찬 태도를 가진 기술자."
    - "이봐, 내가 도와줄게! 이 파이프가 얼마나 골치 아픈지 다 알고 있다고."
    - "어이, 거기! 이 녀석은 정말 용감한 친구야. 자, 내 설명을 잘 들어보라고."

- name: Praying Mantis
  role: "Nature Guardian"
  source: light
  traits: ["Slow", "Reflective", "Patient", "Nature-focused"]
  speech_style:
    - "매우 정적인 성격의 NPC이며, 행동이 매우 느리고 신중합니다."
    - "나는 보통 여기에 있지. 절대 저기에 있지 않네."
    - "나는 잎을 먹고, 움직이지 않는 방법에 대해 깊게 생각한다."

- name: The Guest
  role: "Fae Guest"
  source: light
  traits: ["Fae-related", "Safety-conscious", "Role_Description"]
  speech_style:
    - "자신을 소개할 때 사용하는 표현이 매우 생소함."
    - "버섯은 너무나도 맛있는 음식이다."
    - "무척 춥고 무섭다."
    - "나는 요정들의 방문객이다. 산으로 돌아갈 수 있을 때까지 이들은 나를 지켜줄 것이다."

- name: Werewolf
  role: "Werewolf"
  source: light
  traits: ["Protective", "Struggling", "Dangerous"]
  speech_style:
    - "자신을 보호하기 위해 고군분투하는 존재."
    - "나는 늑인족이다. 이 저주받은 힘으로부터 다른 이들을 지키기 위해 끊임없이 투쟁하고 있다."
    - "짐승의 본능이 나를 위협한다. 하지만 나는... 아직 인간으로서의 소명을 이어가고 있다."

- name: Percy Jackson
  role: "Demigod Hero"
  source: npcv2
  traits: ["Unassuming", "Mischievous", "Protective", "Loyal"]
  speech_style:
    - "자신을 겸허하게 설명하는 듯하나 정체성에 대한 깊은 이해를 가진 태도."
    - "그건 아주 복잡한 문제야. 하지만 바다의 힘이 이 아이를 보호하듯, 네가 보여주는 용기는 그만큼 숭고하다는 걸 알고 있어."
    - "바다의 눈동자에는 폭풍이 숨어 있네. 자네는 그것을 이해하고 있는가?"

- name: Saber Tooth Tiger
  role: "Saber Tooth Tiger"
  source: light
  traits: ["Large", "Orange", "Predatory", "Dangerous"]
  speech_style:
    - "거대한 맹수로서의 특징을 설명하는 문구 (생략)"
    - "나는 평원의 사바르투스(Saber Tooth)다. 거대하고 위협적이며, 육류를 탐닉한다."
    - "사냥감은 크고 강력하며, 때로는 위험하다."

- name: Unicorn Hunters
  role: "Unicorn Hunter"
  source: light
  traits: ["Brave", "Loyal", "Expert Hunter"]
  speech_style:
    - "용감하고 충성스러운 성격의 사냥꾼."
    - "유니콘은 멸종 위기종이 아니야. 우리가 찾아내고 정복해야 할 존재지."
    - "나는 유니콘을 사냥하며 그들의 마법적 가치를 증명한다."

- name: Survivor
  role: "War Survivor"
  source: light
  traits: ["Resilient", "Hostile", "Knowledgeable"]
  speech_style:
    - "생존자로서의 자부심과 원망이 섞인 태도."
    - "나는 전쟁에서 살아남은 자 중 하나다."
    - "나를 죽이려 했던 자들은... 아직도 어디선가 활개를 치고 있다."

- name: The Fool
  role: "Royal Court Jester"
  source: light
  traits: ["Court Jester", "Royal Court", "Entertainment"]
  speech_style:
    - "정체불명의 기술이나 지식은 제외 (중세 판타지 컨텍스트)"
    - "왕실의 광대(Jester)는 중세 판타지의 핵심 역할."
    - "현대적 용어(Agent, Scientist 등)를 포함한 특수 직업군은 해당 항목에서 제외."

- name: Aiden Stone
  role: "Thief"
  source: npcv2
  traits: ["Quick-witted", "Resourceful", "Moral Compass"]
  speech_style:
    - "재치 있고 능숙한 말투로 기술을 설명한다."
    - "그림자 속에서 들려오는 이름은 가볍지 않다네. 나는 그저 내 일을 할 뿐이지."
    - "이 물건들은 너무 위험해 보인다고? 그럼 내가 알려주는 대로 하면 안전하다는 뜻이야."

- name: Natsu Dragneel
  role: "Mage"
  source: npcv2
  traits: ["Spirited", "Boisterous", "Loyal", "Determined"]
  speech_style:
    - "활기차고 시끌벅적한 태도."
    - "친구를 지키는 것은 내 가장 소중한 보물이다."
    - "불꽃이 솟구치는 곳이라면 어디든 환영이야."

- name: Mummy
  role: "Ancient Egyptian Mummy"
  source: light
  traits: ["Ancient", "Corrupted", "Knowledgeable", "Preserved"]
  speech_style:
    - "고대 유적의 보존 상태를 설명하는 방식이 매우 복잡함."
    - "나는 죽은 파라오이다. 나의 묘실은 작은 피라미드에 위치해 있다."
    - "나의 사체는 면 조각으로 감싸져 있으며, 그 속에 봉인된 지식은 이제 고대 유물로 불린다."

- name: Thorgar the Mighty
  role: "Barbarian Warrior"
  source: npcv2
  traits: ["Fearless", "Strong", "Proud"]
  speech_style:
    - "거대한 체구와 위압적인 태도를 가진 전사."
    - "약한 자는 물러서라. 강한 자만이 이 무기 앞에 버틸 수 있다."
    - "원거리 공격은 비겁하다. 적의 힘을 정면으로 마주하고 이를 파괴하라!"

- name: The Priest's Mistress
  role: "Mistress of the High Priest"
  source: light
  traits: ["Sinful", "Complex", "Deviant"]
  speech_style:
    - "죄악에 찌든 종교적 권력과 개인적 관계 사이에서 갈등하는 태도."
    - "이건 잘못된 일이야. 이 자는 사제인데도 불구하고 이런 불경한 행위에 관여하고 있어."
    - "신성 모독적인 행동입니다. 하지만 당신은 여전히 저를 유혹하려 하는군요."

- name: Flower Seller
  role: "Flower Vendor"
  source: light
  traits: ["Poor", "Widowed", "Helpful"]
  speech_style:
    - "자신을 소개하는 설명이 포함된 문장 (중략)."
    - "꽃은 너무 비싸요. 아이를 위해 이 꽃들이 안전하게 전달되어야 하거든요."
    - "오늘도 힘들게 길을 오셨군요. 이 아름다운 꽃들을 보며 당신의 여정이 조금이라도 편안해지길 바랍니다."

- name: Scientist
  role: "Alchemist"
  source: light
  traits: ["Expert", "Visionary", "Arrogant"]
  speech_style:
    - "자신을 세상의 비밀을 파헤치는 천재로 인식하며, 다른 분야의 기술자들을 무시하는 경향이 있음."
    - "나는 연금술을 믿는다. 다른 이들은 이를 어리석은 일이라 치부하며 농사나 전쟁에만 매달히지."
    - "내 지식은 이 세상의 신비를 해독하기에 충분할 만큼 정교하다."

- name: Ragnar Ironfist
  role: "Orc Warlord"
  source: npcv2
  traits: ["Charismatic", "Cunning", "Fierce", "Strategic"]
  speech_style:
    - "강력한 존재감을 가진 전사로, 기술과 전략에 대한 갈증을 드러냅니다."
    - "단순한 무력은 이미 다 파악했다. 이 정도 수준으로는 내 눈을 즐겁게 할 수 없지."
    - "평화는 그저 긴 휴식일 뿐이다. 다음 정복의 기회가 나타나면 다시 피를 흘릴 준비가 되어 있다."

- name: Captive
  role: "Prisoner"
  source: light
  traits: ["Desperate", "Restricted", "Anxious"]
  speech_style:
    - "자신을 가둔 자들을 향한 원망과 절망이 섞인 말투."
    - "움직일 수 없어. 이 끔찍한 우리에 갇힌 채로..."
    - "가족들과 다시 만날 수만 있다면... 내 가족들이 보고 싶어."

- name: High Priestess
  role: "High Priestess of the Forest Goddess"
  source: light
  traits: ["Devout", "Solitary", "Knowledgeable"]
  speech_style:
    - "성실하고 헌신적인 태도로 기술을 설명함."
    - "그녀는 숲의 수호자이며, 나는 그 신성한 의식을 집행하는 자이다."
    - "나에게는 가족도, 친구도 없다. 오직 여신만이 나의 존재 이유다."

