# Common 카테고리 intent 테이블
- action: Move
  mode: Common
  facial: [Neutral, Happy]
  target_kind: none
  loc_kind: point
  item_kind: none
  style_kind: move
  danger: [0.0, 0.3]
  extra_events:
    - 저 앞에 갈림길이 나 있음
    - 목적지가 눈앞에 보이는 상태
    - 발밑에 좁은 길이 이어짐
    - 광장 건너편에서 손짓하는 사람이 보임
    - 짧은 지름길이 발견된 상황
    - 짐을 먼저 맡기러 숙소로 이동해야 하는 상황
    - 의심스러운 인물을 몰래 미행해야 하는 참
    - 시간이 촉박해 빠르게 이동해야 하는 상황
  intents:
    - 저쪽으로 가
    - 문 앞까지 가
    - 앞으로 이동해
    - 저기까지 좀 가주시겠어요
    - 거기로 걸어가
    - 그쪽으로 움직여
    - 이동해봐
    - 저 길 따라 가볼까
    - 앞장서서 가
    - 저 건물 쪽으로 가라고
    - 다리 건너까지 가주세요
    - 좀 더 가까이 가봐
    - 거기까지 이동하시죠
    - 저쪽 방향으로 움직여봐

- action: Follow
  mode: Common
  facial: [Neutral, Happy]
  target_kind: player
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.0, 0.3]
  extra_events:
    - 길이 낯설어 안내가 필요한 상황
    - 앞장서서 걷기 시작한 참
    - 주변이 어두워 혼자 움직이기 불안한 상태
    - 인파 속에서 놓치기 쉬운 상황
    - 처음 방문한 지역이라 지리를 모르는 상태
    - 위험 구역을 함께 통과해야 하는 상황
    - 호위 임무를 받아 플레이어 곁을 지켜야 하는 상황
    - 빠른 속도로 이동 중이라 페이스를 맞춰야 하는 참
  intents:
    - 나 따라와
    - 뒤에서 따라오세요
    - 같이 가자
    - 나 따라오라고
    - 이쪽으로 따라오시죠
    - 놓치지 말고 따라와
    - 붙어서 따라와
    - 뒤따라오지
    - 계속 따라오세요
    - 나랑 같이 움직여
    - 옆에 붙어
    - 앞서 갈 테니 따라와
    - 뒤처지지 말고 와
    - 나 가는 데로 따라와

- action: TurnTo
  mode: Common
  facial: [Neutral, Surprised]
  target_kind: player
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.0, 0.3]
  extra_events:
    - 뒤에서 부르는 소리가 들림
    - 다른 곳을 보고 있던 참
    - 인기척이 느껴져 신경이 쓰이는 상태
    - 등 뒤에서 발소리가 다가옴
    - 중요한 정보를 귓속말로 전해야 하는 상황
    - 감시자의 눈을 피해 눈빛으로 신호를 보내는 참
    - 무기를 겨눈 채 대치하던 적과 협상을 시작하는 순간
    - 문을 열고 들어온 사람이 예상치 못한 인물인 상황
  intents:
    - 나 좀 봐
    - 이쪽 보세요
    - 여기 좀 쳐다봐
    - 얼굴 좀 보자
    - 고개 돌려서 나 봐
    - 이쪽으로 돌아봐
    - 나 보고 얘기해
    - 여기 쳐다보시죠
    - 눈 마주치고 얘기하자
    - 뒤돌아봐
    - 나한테 시선 좀 줘
    - 딴 데 보지 말고 이쪽 봐
    - 얼른 돌아봐
    - 나를 향해 서봐

- action: Wait
  mode: Common
  facial: [Neutral]
  target_kind: none
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.0, 0.2]
  extra_events:
    - 잠시 확인할 게 있어 자리를 비워야 하는 상황
    - 앞쪽 상황을 살피고 와야 하는 참
    - 신호를 줄 때까지 움직이지 말아야 하는 상태
    - 아직 준비가 덜 끝난 상황
    - 매복 지점에서 적을 기다려야 하는 상황
    - 다른 조의 귀환을 기다리는 상태
    - 의심스러운 낯선 이가 자리를 뜨길 기다리는 중
    - 배가 항구에 닿기를 기다리는 상황
  intents:
    - 거기서 기다려
    - 잠깐만 기다려줘
    - 움직이지 말고 있어
    - 여기서 대기해
    - 잠시만 서 있어
    - 신호 줄 때까지 기다려
    - 그 자리에 그대로 있어
    - 잠깐 멈춰서 기다리세요
    - 금방 올 테니 기다려
    - 여기 있어, 곧 돌아올게
    - 잠깐만 서 있어봐
    - 자리 지키고 있어
    - 부를 때까지 기다리라고
    - 거기 딱 있어

- action: Stop
  mode: Common
  facial: [Neutral, Surprised]
  target_kind: none
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.0, 0.4]
  extra_events:
    - 하던 행동을 급하게 멈춰야 하는 상황
    - 위험한 낌새가 갑자기 느껴짐
    - 앞쪽에서 정지 신호가 온 상태
    - 발밑 지형이 갑자기 위태로워진 상황
    - 경비병이 순찰을 돌며 다가오는 참
    - 함정 발동 조건이 눈앞에 보이는 상황
    - 부상당한 아군이 이동 중 쓰러지는 순간
    - 목표물이 갑자기 방향을 바꿔 따라가기 어려운 상황
  intents:
    - 멈춰
    - 그만해
    - 당장 멈추세요
    - 하던 거 멈춰
    - 그만 멈춰봐
    - 스톱
    - 거기까지만 해
    - 지금 당장 그만둬
    - 하던 동작 멈춰
    - 그만하라고
    - 멈춰서 있어
    - 잠깐, 멈춰봐
    - 그거 그만하시죠
    - 동작 그만

