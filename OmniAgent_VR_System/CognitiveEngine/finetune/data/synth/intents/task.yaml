# Task 카테고리 intent 테이블 (형식 기준: lifestyle.yaml)
- action: Craft
  mode: Task
  facial: [Neutral, Happy]
  target_kind: none
  loc_kind: none
  item_kind: inventory
  style_kind: none
  danger: [0.0, 0.2]
  extra_events:
    - 근처에 필요한 재료가 모여 있음
    - 화로 불이 알맞게 달아오른 상태
    - 작업대 위에 도구가 펼쳐져 있음
    - 부족한 장비를 채워야 하는 상황
    - 밤을 넘기기 전에 준비를 끝내야 하는 상황
    - 오랜 탐험 끝에 희귀 재료를 손에 넣은 참
    - 독특한 레시피를 처음으로 시도해보는 흥분된 상태
    - 손상된 장비를 임시로 수선해야 하는 급박한 상황
  intents:
    - 이거 좀 만들어
    - 재료로 뭐 좀 만들어봐
    - 그거 하나 제작해 줘
    - 필요한 거 좀 만들어주시겠어요
    - 가진 재료로 만들어봐
    - 뚝딱 하나 만들어봐
    - 만들어야 할 게 있어
    - 작업대에서 뭐 좀 만들어
    - 이 재료들로 만들어 볼래
    - 필요하니까 하나 만들어
    - 만들 수 있으면 만들어봐
    - 재료 낭비하지 말고 잘 만들어
    - 손 좀 놀려서 만들어봐
    - 이거 조합해서 뭐라도 만들어
    - 만들어 줄 수 있어?
    - 재료 챙겼으니 제작해봐

- action: Drop
  mode: Task
  facial: [Neutral]
  target_kind: none
  loc_kind: none
  item_kind: inventory
  style_kind: none
  danger: [0.0, 0.3]
  extra_events:
    - 짐이 너무 무거워진 상태
    - 손이 자유로워야 하는 상황
    - 필요 없는 물건이 가방에 남아 있음
    - 조용히 움직여야 해서 짐을 줄여야 하는 상황
    - 바닥에 물건을 놓고 가야 하는 상황
    - 적에게 쫓기는 상황에서 짐을 버려야 달아날 수 있는 상태
    - 무거운 보물을 들고 있어 수중에서 이동이 불가능한 상황
    - 민감한 물품을 소지하면 경비에 걸릴 수 있는 관문 앞
  intents:
    - 그거 내려놔
    - 가진 거 좀 버려
    - 손에 든 거 놔둬
    - 짐 좀 내려놓지
    - 그거 바닥에 놔
    - 필요 없으면 버려
    - 무거우면 내려놔
    - 들고 있는 거 놓고 가
    - 그만 들고 놓아둬
    - 여기 두고 가자
    - 짐 좀 덜어내
    - 그거 그냥 버려버려
    - 내려놓고 손 비워
    - 가방에서 꺼내서 놔둬
    - 이제 그거 내려놓으세요
    - 놓고 가도 돼

- action: PickUp
  mode: Task
  facial: [Neutral, Happy]
  target_kind: none
  loc_kind: point
  item_kind: none
  style_kind: none
  danger: [0.0, 0.2]
  extra_events:
    - 바닥에 뭔가 떨어져 있는 게 보임
    - 저 앞에 놓여 있는 물건이 눈에 띔
    - 누군가 흘리고 간 물건이 있음
    - 수풀 사이에 물건이 반쯤 파묻혀 있음
    - 계단 위에 뭔가 놓여 있는 상태
    - 적이 쓰러지며 열쇠를 떨어뜨린 순간
    - 강 건너편에 보이는 중요한 유물을 회수해야 하는 상황
    - 전쟁터에서 쓰러진 동료의 유품을 챙기는 장면
  intents:
    - 저거 주워
    - 저기 떨어진 거 주워와
    - 그거 좀 집어와
    - 저기 있는 물건 주워봐
    - 바닥에 있는 거 챙겨
    - 저것 좀 주워 오시겠어요
    - 저기 놓인 거 집어들어
    - 떨어뜨린 거 주워줘
    - 저거 챙겨서 와
    - 저기 있는 거 집어
    - 놓치지 말고 주워
    - 저것 좀 줍고 와
    - 바닥에 있는 물건 집어들어
    - 저기 저거 챙겨오라고
    - 발밑에 떨어진 거 주워
    - 저거 놔두지 말고 주워와

- action: Repair
  mode: Task
  facial: [Neutral]
  target_kind: none
  loc_kind: none
  item_kind: inventory
  style_kind: none
  danger: [0.0, 0.2]
  extra_events:
    - 장비가 망가져 제대로 쓸 수 없는 상태
    - 부서진 부분이 눈에 띄게 벌어져 있음
    - 전투 중 손상을 입은 상태
    - 낡아서 곧 못 쓰게 될 것 같은 상태
    - 급하게 고쳐야 다음 전투에 쓸 수 있는 상황
    - 대장간 앞에서 수리를 의뢰하려는 참
    - 야전에서 임시로 수리해 당장 써야 하는 긴급 상황
    - 귀중한 가보인 무기가 오랜 방치로 녹이 슨 상태
  intents:
    - 이거 좀 고쳐
    - 부서진 거 수리해
    - 망가진 거 고쳐줘
    - 이거 손볼 수 있어?
    - 고칠 수 있으면 고쳐봐
    - 부서졌으니까 고쳐
    - 손상된 부분 고쳐줘
    - 수리 좀 해주시겠어요
    - 이거 못 쓰게 됐어, 고쳐
    - 고장 났으니 손봐
    - 망가진 거 손 좀 봐
    - 급하게 고쳐야 해
    - 이거 수리해 놔
    - 고쳐서 다시 쓸 수 있게 해
    - 부서진 데 손봐줘
    - 고쳐줄 수 있나
