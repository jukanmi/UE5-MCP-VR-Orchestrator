# Combat 카테고리 intent 테이블 (형식 기준: lifestyle.yaml)
- action: Attack
  mode: Combat
  facial: [Angry, Fear]
  target_kind: enemy
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.5, 0.9]
  extra_events:
    - 적이 사정거리 안으로 들어옴
    - 상대가 빈틈을 보이며 다가섬
    - 아군이 포위당해 지원이 필요한 상황
    - 괴물이 먼저 달려듦
    - 협상이 결렬되고 무기를 빼든 상태
    - 적이 등을 돌린 채 방심한 상태
    - 기습 매복에서 적이 모습을 드러낸 순간
    - 중요 인물을 지키는 적의 방어선이 뚫린 참
  intents:
    - 공격해
    - 저놈을 쳐
    - 덤벼들어서 베어버려
    - 지금 공격하시죠
    - 저 적부터 처리해
    - 망설이지 말고 쳐
    - 저기 놈 좀 잡아
    - 지금이 기회야, 쳐
    - 검을 휘둘러
    - 밀어붙여
    - 상대를 노려서 쳐
    - 공격하라고
    - 저놈 먼저 베어
    - 힘껏 후려쳐
    - 적을 몰아붙여
    - 저 녀석부터 쳐내

- action: Block
  mode: Combat
  facial: [Angry, Fear, Surprised]
  target_kind: none
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.5, 0.9]
  extra_events:
    - 적의 칼이 위에서 떨어지는 순간
    - 화살이 정면으로 날아오는 상황
    - 상대가 강타를 준비하는 게 보임
    - 등 뒤에서 기습이 들어오는 순간
    - 방패를 쥔 손에 힘이 들어감
    - 적이 연속 공격을 퍼붓기 시작함
    - 아군이 쓰러진 틈새를 적이 파고드는 상황
    - 마법 투사체가 머리를 향해 날아오는 순간
  intents:
    - 막아
    - 방패로 막아
    - 그거 막아내
    - 버티고 막아
    - 정면으로 막아서
    - 막아야 해, 지금
    - 방어 자세 잡아
    - 막아내세요
    - 그 공격 받아쳐 막아
    - 밀리지 말고 막아
    - 막고 버텨
    - 정면에서 받아내
    - 방패 들고 막아
    - 그대로 막아서
    - 공격을 막아
    - 버텨내면서 막아

- action: Dodge
  mode: Combat
  facial: [Fear, Surprised]
  target_kind: none
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.5, 0.9]
  extra_events:
    - 갑자기 옆에서 공격이 들어오는 순간
    - 발밑에서 함정이 작동하는 소리가 들림
    - 커다란 물체가 날아오는 상황
    - 상대가 빠르게 찌르기를 시도하는 순간
    - 바닥이 무너지려는 조짐이 보임
    - 독침이 섞인 발사체가 빗발치는 상황
    - 폭발물이 발밑으로 굴러오는 순간
    - 적의 범위 공격이 시작되는 조짐이 보임
  intents:
    - 피해
    - 옆으로 피해
    - 재빨리 비켜
    - 몸을 굴려서 피해
    - 그거 피하라고
    - 피해야 해, 지금
    - 살짝 비켜서
    - 옆으로 굴러 피해
    - 피할 수 있으면 피해
    - 몸 낮춰서 피해
    - 재빠르게 비켜서
    - 피하고 봐
    - 순간적으로 비켜
    - 그 공격 피해라
    - 몸을 틀어서 피해
    - 잽싸게 피해

- action: Flee
  mode: Combat
  facial: [Fear, Surprised]
  target_kind: none
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.6, 1.0]
  extra_events:
    - 적 수가 압도적으로 많아짐
    - 아군이 전멸 직전까지 몰린 상황
    - 강력한 적이 나타나 승산이 없어 보임
    - 퇴로가 곧 막히려는 상황
    - 부상이 심해 더는 버틸 수 없는 상태
    - 보스 몬스터가 두 번째 형태로 변신하는 순간
    - 함정에 걸려 사방이 적에게 둘러싸인 상태
    - 지원이 전혀 오지 않아 고립된 상황
  intents:
    - 도망가
    - 지금 도망쳐야 해
    - 여기서 빠져나가
    - 물러나
    - 후퇴해
    - 뒤로 빠져
    - 도망치라고
    - 살고 싶으면 도망가
    - 이건 못 이겨, 도망가
    - 빨리 빠져나가야 해
    - 여길 벗어나
    - 전부 물러나
    - 뒤로 물러나서 빠져
    - 승산 없어, 튀어
    - 지금 튀어야 해
    - 도망쳐서 살아남아

- action: SignalAllies
  mode: Combat
  facial: [Angry, Fear]
  target_kind: none
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.4, 0.9]
  extra_events:
    - 지원이 필요한 상황에서 아군이 근처에 있음
    - 적의 위치를 파악해 알려야 하는 상황
    - 매복을 발견해 동료에게 알려야 함
    - 혼자서는 감당하기 힘든 상대와 마주침
    - 아군이 흩어져 있어 집결이 필요한 상황
    - 탈출로를 확보하려면 다수가 동시에 움직여야 하는 상황
    - 강력한 적의 주의를 분산시켜야 하는 전술적 순간
    - 아군의 위치가 서로 파악되지 않아 신호가 필요한 상황
  intents:
    - 다른 사람들 불러
    - 소리쳐서 알려
    - 동료들한테 신호 보내
    - 지원 요청해
    - 다들 여기로 부르라고
    - 큰 소리로 알려서 모아
    - 신호 보내서 도움 청해
    - 아군한테 알려
    - 소리 질러서 불러모아
    - 위험하다고 알려
    - 다른 이들 불러오라고
    - 신호탄 쏴서 알려
    - 손 흔들어서 신호 보내
    - 여기로 모이라고 알려
    - 크게 외쳐서 불러
    - 다들 이쪽으로 부르라고
