# Investigation 카테고리 intent 테이블 (형식 기준: lifestyle.yaml)
- action: Investigate
  mode: Investigation
  facial: [Neutral, Surprised]
  target_kind: none
  loc_kind: point
  item_kind: none
  style_kind: none
  danger: [0.1, 0.5]
  extra_events:
    - 수상한 흔적이 한 곳에 남아 있음
    - 이상한 소리가 난 지점이 있음
    - 벽에 낯선 표식이 새겨져 있음
    - 바닥에 핏자국이 보이는 상태
    - 무언가 부서진 자리가 눈에 띔
    - 오래된 유적 속에 숨겨진 방이 발견된 참
    - 마을 사람들이 접근을 꺼리는 장소가 있음
    - 특이한 마력이 감지되는 지점을 확인해야 하는 상황
  intents:
    - 저기 좀 자세히 살펴봐
    - 저 지점 조사해봐
    - 저거 뭔지 확인해봐
    - 가까이 가서 살펴봐
    - 저기 뭐가 있는지 알아봐
    - 자세히 들여다봐
    - 저 자리 좀 조사해 주시겠어요
    - 뭔가 이상해, 확인해봐
    - 저기 가서 살펴보고 와
    - 꼼꼼히 뒤져봐
    - 저것부터 조사해봐
    - 수상하니까 확인해봐
    - 가까이서 잘 살펴봐
    - 저기 무슨 흔적인지 봐봐
    - 저 자리 한번 뒤져봐
    - 여기 뭐가 있었는지 조사해

- action: Scout
  mode: Investigation
  facial: [Neutral, Surprised]
  target_kind: none
  loc_kind: point
  item_kind: none
  style_kind: none
  danger: [0.1, 0.5]
  extra_events:
    - 앞쪽 지형이 파악되지 않은 상태
    - 이 너머에 뭐가 있는지 모르는 상황
    - 진영을 정하기 전에 주변 확인이 필요한 상황
    - 안전한 길인지 확인해야 하는 상황
    - 야영지를 정하기 전 주변을 둘러봐야 하는 상황
    - 적의 순찰 패턴을 파악해야 하는 침투 임무 중
    - 지도에 표시되지 않은 구역으로 진입하기 전
    - 전위대가 전멸했다는 소식 이후 전방을 확인해야 하는 상황
  intents:
    - 저 앞쪽 좀 정찰하고 와
    - 주변 한 바퀴 둘러보고 와
    - 앞서 가서 살피고 와
    - 이 근방 좀 훑어보고 와
    - 저쪽 지형 좀 살펴보고 와
    - 미리 가서 상황 좀 보고 와
    - 앞길 안전한지 둘러보고 와
    - 주변 살피고 돌아와
    - 저 너머 어떤지 보고 와
    - 앞서 나가서 정찰해봐
    - 이 일대 좀 둘러보시겠어요
    - 먼저 가서 훑어보고 와
    - 주변 상황 파악하고 와
    - 저 구역 한번 둘러보고 와
    - 앞쪽 상황 좀 보고 오라고
    - 넓게 한번 둘러보고 와

- action: Track
  mode: Investigation
  facial: [Neutral, Angry]
  target_kind: enemy
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.2, 0.6]
  extra_events:
    - 적이 남긴 발자국이 이어져 있음
    - 도망친 놈의 흔적이 남아 있음
    - 사냥감이 지나간 자리가 보임
    - 핏자국이 이어지며 멀어지는 상태
    - 적의 냄새가 아직 남아 있는 상황
    - 습격자가 남긴 유류품이 발견된 참
    - 증인 확보를 위해 용의자를 추적해야 하는 상황
    - 요인 암살 후 도주한 자객의 행방을 쫓아야 하는 상황
  intents:
    - 저놈 흔적 쫓아
    - 발자국 따라가
    - 그놈 추적해
    - 놓치지 말고 쫓아가
    - 흔적 놓치지 말고 따라가
    - 저 자식 뒤를 쫓아
    - 도망친 놈 추적하시죠
    - 냄새 맡고 쫓아가
    - 흔적 따라서 잡으러 가
    - 저놈 어디로 갔는지 쫓아
    - 놓치기 전에 따라붙어
    - 흔적 남았으니 쫓아가
    - 그 자식 추적해봐
    - 뒤쫓아서 위치 파악해
    - 발자국 놓치지 말고 쫓아
    - 저놈 행방 쫓아봐
