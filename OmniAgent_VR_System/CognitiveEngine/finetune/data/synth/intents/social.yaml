# Social 카테고리 intent 테이블 (lifestyle.yaml 형식 준수)
- action: Comfort
  mode: Social
  facial: [Neutral, Happy]
  target_kind: player
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.0, 0.2]
  extra_events:
    - 방금 동료를 잃어 얼굴이 굳어 있음
    - 실패한 임무 얘기에 어깨가 축 처짐
    - 밤새 악몽에 시달린 듯 눈이 퀭함
    - 집안 사정을 털어놓다 목이 멤
    - 다친 손을 감싸 쥐고 말이 없어짐
    - 오랜 적과의 결투를 앞두고 두려워하는 상태
    - 결정적인 실수로 모든 게 어긋난 후 자책하는 중
    - 오랫동안 찾던 것을 마침내 잃었다는 소식을 들은 직후
  intents:
    - 괜찮아, 힘내
    - 등 좀 두드려줘
    - 너무 자책하지 마
    - 옆에서 좀 다독여줘
    - 힘든 거 알아, 위로해줘
    - 괜찮다고 말해줘
    - 그렇게 울지 말고, 안아줘
    - 다 잘 될 거라고 해줘
    - 어깨 한번 잡아줘
    - 혼자 두지 말고 달래줘
    - 표정이 안 좋은데 말 좀 걸어줘
    - 마음 좀 풀어줘
    - 너 잘못 아니야, 그렇게 말해줘
    - 곁에서 위로 좀 해주시죠
    - 토닥여줘, 많이 힘든가 봐

- action: Emote
  mode: Social
  facial: [Happy, Neutral, Angry]
  target_kind: none
  loc_kind: none
  item_kind: none
  style_kind: emote
  danger: [0.0, 0.3]
  extra_events:
    - 저 멀리서 아는 얼굴이 보임
    - 광장에서 승전 소식이 발표됨
    - 지나가던 이가 던진 농담이 제법 웃김
    - 순찰 교대 시간에 상관이 지나감
    - 시비 거는 자가 앞을 가로막음
    - 마을 사람들이 환호성을 지름
    - 오랜 적과 예상치 못하게 마주친 상황
    - 귀빈 앞에서 공식 예절이 필요한 장면
  intents:
    - 손 흔들어줘
    - 반갑다고 인사해
    - 고개 숙여 인사해
    - 정중히 예를 갖춰줘
    - 신나게 환호해봐
    - 다 같이 만세 불러
    - 크게 한번 웃어봐
    - 웃기니까 웃어
    - 경례 붙여
    - 절도 있게 경례해봐
    - 저놈한테 겁 좀 줘
    - 위협적으로 노려봐
    - 손짓으로 알은체해
    - 저쪽 향해 반갑게 흔들어
    - 승리를 만끽하며 환호해
    - 비웃듯이 웃어줘

- action: GiveItem
  mode: Social
  facial: [Happy, Neutral]
  target_kind: player
  loc_kind: none
  item_kind: inventory
  style_kind: none
  danger: [0.0, 0.2]
  extra_events:
    - 여행에 필요할 물건이 남아도는 상태
    - 보답으로 뭔가 챙겨주고 싶어함
    - 창고 정리 중 쓸만한 물건이 나옴
    - 마지막 인사로 기념될 걸 남기고 싶어함
    - 짐이 무거워 나눠 갖자는 얘기가 나옴
    - 중요한 의뢰를 완수한 보상으로 건네는 상황
    - 위험한 길을 앞두고 쓸 만한 물건을 챙겨주는 참
    - 오랜 스승이 마지막으로 유품을 전달하는 장면
  intents:
    - 그거 너 가져
    - 이거 줄게, 받아
    - 이건 네 몫이야
    - 필요할 것 같아서 주는 거야
    - 가지고 있어, 이제 네 거다
    - 자, 이거 선물이야
    - 앞으로 요긴하게 써
    - 이 물건 너한테 넘길게
    - 받으세요, 드리는 겁니다
    - 나눠 줄 테니 챙겨둬
    - 이거 네가 갖는 게 낫겠다
    - 자 받아라, 답례다
    - 챙겨가, 안 쓰는 거야
    - 이건 그냥 너 줄게
    - 가져도 돼, 넘겨줄게

- action: HandObject
  mode: Social
  facial: [Neutral, Happy]
  target_kind: player
  loc_kind: none
  item_kind: inventory
  style_kind: none
  danger: [0.0, 0.2]
  extra_events:
    - 두 손이 다 차 있어 도움이 필요한 상태
    - 작업대 위 물건을 건네받아야 하는 상황
    - 잠깐 맡아 달라고 부탁하는 참
    - 손이 닿지 않는 위치의 물건을 찾는 중
    - 증거물을 안전하게 전달해야 하는 임무 중
    - 약재를 배합하면서 양손이 부족한 상황
    - 다음 의식을 치르기 전 물건을 미리 건네야 하는 상황
    - 대장간 작업 중 공구를 빠르게 넘겨야 하는 참
  intents:
    - 그거 좀 건네줘
    - 이거 잠깐 들고 있어
    - 손 좀 뻗어서 집어줘
    - 잠깐만 이거 잡아줘
    - 그 물건 좀 넘겨줘
    - 이리 좀 줘봐
    - 저것 좀 집어서 건네주시죠
    - 잠깐 맡아줄래
    - 그거 이쪽으로 좀 줘
    - 손에 쥐여줘
    - 그거 좀 넘겨봐
    - 잠깐 들어줘, 손이 모자라
    - 그 물건 좀 집어줘
    - 이거 대신 좀 들고 있어봐
    - 손 닿는 대로 건네줘

- action: Trade
  mode: Social
  facial: [Happy, Neutral]
  target_kind: player
  loc_kind: none
  item_kind: inventory
  style_kind: none
  danger: [0.0, 0.2]
  extra_events:
    - 좌판에 물건을 벌여놓고 손님을 기다리는 중
    - 서로 필요한 물건이 갈리는 상황
    - 값을 흥정하는 목소리가 오가는 중
    - 물물교환이 성행하는 장터 분위기
    - 재고를 처분하려고 값을 낮춘 상태
    - 독점 거래로만 구할 수 있는 희귀 아이템이 있는 상황
    - 여행 전 마지막으로 보급품을 채우는 중
    - 쌍방이 모두 탐내는 물건을 두고 협상이 벌어지는 상황
  intents:
    - 그거랑 이거 바꾸자
    - 물건 좀 사고 싶은데
    - 값 쳐줄 테니 팔아
    - 이거 얼마에 넘길 거야
    - 교환하시죠
    - 필요한 거 있으면 거래하자
    - 그 값에 사겠다
    - 물건 하나 팔아줄래
    - 흥정 좀 해보자
    - 이거 주고 그거 받을게
    - 값만 맞으면 넘겨
    - 거래 트고 싶은데
    - 서로 필요한 거 바꾸자고
    - 팔 물건 있으면 꺼내봐
    - 값 잘 쳐줄 테니 거래하시죠
