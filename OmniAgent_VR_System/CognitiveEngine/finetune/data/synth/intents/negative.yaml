# Negative(액션 없음) 카테고리 intent 테이블
# 정답이 actions: [] (순수 대화) 여야 하는 발화만 모음 — 매 턴 액션 강요 편향 차단용
- kind: smalltalk
  mode: Common
  facial: [Neutral, Happy]
  extra_events:
    - 장이 서서 마을이 북적이는 낮
    - 조용한 저녁, 딱히 할 일이 없는 참
    - 오랜만에 얼굴을 마주친 상황
    - 날씨가 유난히 화창한 아침
    - 손님이 뜸해 한가한 시간
    - 하루 일과를 마치고 쉬는 참
    - 오랜 여정을 마치고 마침내 안전한 곳에 도착한 참
    - 모닥불 옆에서 아무도 말없이 쉬고 있는 조용한 밤
  intents:
    - 오늘 날씨 좋다
    - 잘 지냈어?
    - 요즘 어떻게 지내
    - 오랜만이네
    - 하하, 그러게 말이야
    - 그거 재밌는 얘기네
    - 오늘따라 기분이 좋아 보이네
    - 별일 없지?
    - 여기 분위기 참 좋다
    - 힘든 하루였어
    - 아, 피곤하다
    - 너랑 얘기하니 좋네
    - 요즘 장사는 좀 어때
    - 그러고 보니 오랜만이다
    - 뭐 재밌는 일 없었어?
    - 흠, 그렇구나
    - 심심한데 얘기나 좀 하자
    - 오늘 하루 어땠어
    - 좋은 아침이야
    - 늘 그렇지 뭐

- kind: question
  mode: Common
  facial: [Neutral, Surprised]
  extra_events:
    - 처음 온 여행자가 길을 헤매는 참
    - 마을에 이상한 소문이 돌고 있음
    - 낯선 인물이 최근 마을에 나타남
    - 오래된 유적에 대한 이야기가 화제인 참
    - 다음 목적지를 정해야 하는 상황
    - 중요한 의뢰 전 현지 정보가 필요한 참
    - 전쟁 이후 바뀐 세력 판도를 파악해야 하는 상황
    - 언급된 인물이 실제로 존재하는지 확인하는 상황
  intents:
    - 여관이 어디 있어?
    - 이 근처에 대장간 있나
    - 시장으로 가려면 어느 쪽이야
    - 그 소문 진짜야?
    - 저 사람은 누구야
    - 여긴 무슨 마을이야
    - 성문까지 얼마나 걸려
    - 요즘 마을에 무슨 일 있었어?
    - 촌장님 댁이 어디쯤이지
    - 저 탑은 뭐 하는 곳이야
    - 이 지역 영주가 누구야
    - 강 건너로 가는 다리가 있어?
    - 여기 위험한 곳이야?
    - 그 유적에 대해 아는 거 있어
    - 마을 축제는 언제 열려
    - 여기서 제일 가까운 마을은 어디야
    - 저 사람들 왜 모여 있는 거야
    - 최근에 이상한 일 없었어?
    - 이 길 끝에 뭐가 있어
    - 밤에 돌아다녀도 괜찮은 곳이야?

- kind: refuse_item
  mode: Social
  facial: [Neutral, Surprised]
  extra_events:
    - 여행 중 물자가 부족해진 상황
    - 상대가 급하게 무언가를 필요로 하는 참
    - 교환할 물건이 있는지 서로 확인하는 중
    - 전투 직후 소모품을 점검하는 상황
    - 먼 길을 떠나기 전 채비를 하는 중
    - 상대가 과도한 요구를 굉장히 자연스럽게 꺼내는 상황
    - 아직 나눠줄 여유가 없는 상황에서 요청을 받는 참
    - 특정 아이템이 임무에 필수적이라 건네줄 수 없는 상황
  intents:
    - 그 검 좀 줘
    - 포션 있으면 하나 줘
    - 화살 좀 나눠줄 수 있어?
    - 그 방패 나한테 줘봐
    - 돈 좀 빌려줘
    - 여분의 로프 있으면 줘
    - 그 지도 좀 줘봐
    - 열쇠 가지고 있으면 줘
    - 붕대 남은 거 있어?
    - 횃불 하나만 줘
    - 그 반지 나 줘봐
    - 식량 좀 나눠줄래
    - 마법서 있으면 좀 보여줘
    - 그 목걸이 줄 수 있어?
    - 방독면 같은 거 있어?
    - 여분의 갑옷 있으면 줘
    - 그 술병 좀 줘봐
    - 활 하나만 빌려줘
    - 폭탄 있으면 하나 줘
    - 그 보석 나한테 넘겨

- kind: refuse_invalid
  mode: Common
  facial: [Neutral, Surprised]
  extra_events:
    - 상대가 터무니없는 요구를 꺼낸 참
    - 그 자리에 없는 사람을 언급하는 상황
    - 현실적으로 불가능한 부탁을 받은 상황
    - 상대가 농담인지 진담인지 애매하게 말한 참
    - 급박한 상황에서 무리한 요구가 나온 상황
    - 술에 취한 듯 뜬금없는 말을 꺼내는 상황
    - 황당한 요구를 진지하게 믿고 있는 상대를 마주하는 참
    - 마법으로도 불가능한 일을 당연히 된다고 여기는 상황
  intents:
    - 저기 왕이랑 얘기해봐
    - 하늘로 날아가 봐
    - 여기 없는 상인 불러와
    - 죽은 사람 살려내
    - 벽을 뚫고 지나가 봐
    - 시간을 되돌려줘
    - 저 산을 옮겨봐
    - 여기 없는 대장장이 데려와
    - 순간이동으로 가자
    - 용을 소환해봐
    - 저 별을 따다 줘
    - 없는 문을 열어봐
    - 바다를 가르고 지나가
    - 여기 없는 여왕님을 만나게 해줘
    - 물 위를 걸어봐
    - 죽은 자와 대화해봐
    - 저기 있지도 않은 다리를 건너
    - 투명해져 봐
    - 저 유령이랑 싸워봐
    - 없는 성을 찾아가 봐

- kind: emotion_only
  mode: Social
  facial: [Happy, Sad, Surprised, Angry, Neutral]
  extra_events:
    - 갑작스럽게 좋은 소식을 들은 참
    - 오랜 기다림 끝에 소원이 이루어진 상황
    - 예상치 못한 재회에 기쁨이 넘치는 상태
    - 억울한 누명을 벗고 울음이 터지는 순간
    - 힘든 여정을 돌아보며 복잡한 감정이 드는 참
    - 누군가의 따뜻한 말 한마디에 마음이 뭉클해지는 상황
    - 오랫동안 참아온 감정이 터져 나오는 순간
    - 뜻밖의 칭찬에 쑥스럽고 기뻐하는 상태
  intents:
    - 우와, 진짜?
    - 믿을 수가 없어
    - 설마, 정말이야?
    - 고마워, 진심으로
    - 아, 정말 다행이다
    - 뭔가 이상하게 기분이 묘하네
    - 어, 놀랐잖아
    - 그냥 감사할 따름이야
    - 와, 이게 꿈이야 생시야
    - 어떻게 말해야 할지 모르겠어
    - 솔직히 많이 힘들었어
    - 이럴 줄은 몰랐네
    - 기쁜 건지 슬픈 건지 모르겠어
    - 그냥 마음이 벅차
    - 뭔가 찡하다
    - 감사해요, 정말로
    - 어, 그랬어? 놀랍다
    - 전혀 예상 못 했는데
    - 그 말 들으니 마음이 좀 놓여
    - 음... 잘 모르겠어

- kind: request_comfort
  mode: Social
  facial: [Sad, Tired, Neutral]
  extra_events:
    - 오랫동안 혼자 힘든 걸 참아온 상태
    - 실패한 임무 후 자책이 심해진 상황
    - 동료를 잃어 슬픔에 빠진 참
    - 아무도 이해해주지 않는 것 같아 외로운 상태
    - 몸과 마음 모두 지쳐서 쓰러질 것 같은 순간
    - 혼자 감당하기 너무 무거운 짐을 지고 있는 상황
    - 오랜 여정에 지쳐 위로가 필요한 참
    - 고향이 그리워 마음이 힘든 상태
  intents:
    - 나 좀 위로해줘
    - 힘들어, 옆에 있어줘
    - 나한테 괜찮다고 말해줘
    - 그냥 옆에 있어도 돼?
    - 뭔가 말해줘, 아무 말이라도
    - 혼자 두지 말아줘
    - 힘이 안 나, 달래줘
    - 너라도 나 이해해줘
    - 잠깐만 같이 있어줘
    - 어깨 좀 빌려줄 수 있어?
    - 따뜻한 말 한마디만 해줘
    - 나 많이 힘들어
    - 그냥 옆에 앉아 있어줘
    - 위로받고 싶어
    - 마음이 너무 무거워, 뭐라도 해줘
    - 지금 많이 외로워
    - 힘든 게 티 나?
    - 좀 쉬고 싶어
    - 뭐라고 해줘, 뭐든
    - 그냥 함께 있어줘

- kind: ambient_observation
  mode: Common
  facial: [Neutral, Surprised, Happy]
  extra_events:
    - 길을 걷다 흥미로운 것을 발견한 참
    - 마을 광장에서 구경꾼들이 모여 있음
    - 하늘에 이상한 구름 형태가 보이는 상황
    - 낯선 여행자가 특이한 물건을 들고 지나가는 상태
    - 오래된 건물에서 이상한 소리가 들려오는 참
    - 멀리서 연기가 피어오르는 게 보이는 상황
    - 시장에서 싸우는 소리가 들려오는 참
    - 아름다운 석양이 지는 조용한 저녁
  intents:
    - 저거 뭐야?
    - 저기 좀 봐
    - 신기하다
    - 저거 원래 저기 있던 거야?
    - 뭔가 이상하지 않아?
    - 오, 처음 보는 거네
    - 저게 뭔지 알아?
    - 저기서 무슨 소리 나는 것 같은데
    - 저거 좀 이상하다
    - 와, 저거 봤어?
    - 뭐지, 저게
    - 오늘 날씨 좀 이상하지 않아?
    - 저쪽에서 무슨 일이 있는 것 같은데
    - 저 사람 왜 저래?
    - 저거 위험한 거 아냐?
    - 처음 보는 광경이네
    - 이상하다, 저게 뭘까
    - 저기 뭔가 있는 것 같아
    - 아, 저거 재밌다
    - 저 소리 들려?
