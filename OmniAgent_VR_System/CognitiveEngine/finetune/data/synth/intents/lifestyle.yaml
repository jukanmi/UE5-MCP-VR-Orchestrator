# Lifestyle 카테고리 intent 테이블 (기준 예시 — 다른 카테고리는 이 형식을 따른다)
- action: Sit
  mode: Lifestyle
  facial: [Neutral, Happy, Tired]
  target_kind: furniture
  furniture_types: [Chair, Bench, Stool]
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.0, 0.1]
  extra_events:
    - 난롯가에 빈 자리가 나 있음
    - 오래 서 있어 다리가 뻐근한 상태
    - 손님이 빠져 자리가 한산해짐
    - 긴 여행 끝에 마을에 도착한 직후
    - 회의가 시작되기 전 자리를 잡아야 하는 상황
    - 시장 한 켠에 쉬어 갈 벤치가 보임
    - 무거운 짐을 내려놓고 잠시 앉고 싶은 상태
    - 주변 사람들이 모두 앉아서 기다리고 있는 상황
  intents:
    - 의자에 앉아
    - 저기 자리에 좀 앉지
    - 앉으셔도 됩니다
    - 서 있지 말고 앉아
    - 잠깐 앉아서 쉬어
    - 다리 아파 보이는데 앉는 게 어때
    - 자리 비었으니 앉으라고
    - 여기 앉아서 얘기하자
    - 앉아서 기다려
    - 편하게 앉으세요
    - 계속 서 있을 거야? 앉아
    - 걸터앉아서 좀 쉬어가
    - 자리 있을 때 앉아둬
    - 앉아 있어, 금방 올게

- action: Sleep
  mode: Lifestyle
  facial: [Tired, Neutral]
  target_kind: furniture
  furniture_types: [Bed, Bedroll, Cot]
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.0, 0.1]
  extra_events:
    - 밤이 깊어 눈이 감기는 상태
    - 이틀 밤을 새워 체력이 바닥남
    - 여관 방을 잡아둔 상태
    - 다음 날 이른 아침 출발을 앞두고 있음
    - 부상을 입어 몸을 회복해야 하는 상황
    - 깊은 숲 속 야영지에서 침낭을 펼친 상태
    - 전투 후 극도의 피로감이 몰려오는 참
    - 경비를 교대할 시간이 돼 쉬어야 하는 상황
  intents:
    - 침대에 누워
    - 누워
    - 이제 그만 자
    - 침대 가서 눈 좀 붙여
    - 피곤해 보이는데 자러 가
    - 오늘은 여기서 자고 가
    - 누워서 자둬
    - 잠 좀 자 두라고
    - 밤새웠잖아, 가서 자
    - 자리 깔았으니 누우세요
    - 눈 붙이고 있어
    - 한숨 자 두는 게 낫겠어
    - 방에 들어가서 자
    - 좀 누워 있어

- action: StandUp
  mode: Lifestyle
  facial: [Neutral, Surprised]
  target_kind: none
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.0, 0.2]
  extra_events:
    - 앉아 있던 중 인기척이 들림
    - 자리에 앉은 지 한참 지남
    - 밖에서 부르는 소리가 들림
    - 급박한 상황이 생겨 당장 움직여야 하는 상태
    - 오랜 회의가 끝나 자리에서 일어서는 분위기
    - 손님이 도착해 맞이하러 나가야 하는 상황
    - 경보가 울려 대기 중이던 상황에서 즉시 출동해야 함
    - 비가 그쳐 이제 이동을 재개할 수 있게 됨
  intents:
    - 일어나
    - 일어서
    - 그만 자고 일어나
    - 이제 그만 앉아 있고 일어나지
    - 자리에서 일어나 봐
    - 슬슬 일어날 시간이야
    - 일어나라고
    - 언제까지 앉아 있을 거야
    - 몸 좀 일으키세요
    - 기상해
    - 일어나서 준비해
    - 앉은 거 그만하고 일어서
    - 벌떡 일어나
    - 일어날 때 됐어

- action: Read
  mode: Lifestyle
  facial: [Neutral, Happy]
  target_kind: none
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.0, 0.1]
  extra_events:
    - 탁자 위에 펼쳐진 책이 놓여 있음
    - 오래된 문서를 찾아 온 참
    - 등불이 켜져 글을 읽기 좋은 상태
    - 도서관 한 켠에 희귀 고서가 꽂혀 있음
    - 퀘스트 단서가 담긴 쪽지가 건네진 참
    - 지도에 적힌 글씨를 해독해야 하는 상황
    - 마법 두루마리를 펼쳐 내용을 확인해야 함
    - 정보 브로커에게 받은 문서를 검토해야 하는 상황
  intents:
    - 책 읽어
    - 그 책 좀 읽어봐
    - 뭐라고 쓰여 있는지 읽어
    - 글 좀 읽어주지
    - 문서 확인해봐
    - 책 펴서 읽어
    - 읽어보시죠
    - 거기 적힌 거 읽어봐
    - 조용히 책이나 읽고 있어
    - 내용 좀 훑어봐
    - 읽어보라니까
    - 이거 읽을 줄 알아? 읽어봐
    - 기록 좀 살펴봐
    - 책장 넘겨서 읽어

- action: Pray
  mode: Lifestyle
  facial: [Neutral, Tired]
  target_kind: none
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.0, 0.1]
  extra_events:
    - 제단 앞에 촛불이 켜져 있음
    - 마을에 역병이 돌아 흉흉한 분위기
    - 원정을 앞둔 밤
    - 전투에서 동료를 잃고 슬픔에 잠긴 상태
    - 신전 입구에서 참배객들이 줄 서 있음
    - 오랜 소원을 빌기 위해 멀리서 찾아온 상황
    - 위기를 넘기고 감사의 기도를 올리려는 참
    - 제사장이 의식을 시작하기를 기다리는 상황
  intents:
    - 기도해
    - 기도 좀 올려
    - 신께 빌어
    - 여기서 기도하고 가자
    - 제단 앞에서 기도해
    - 무사하길 빌어줘
    - 잠깐 기도 드리자
    - 기도부터 하시죠
    - 두 손 모으고 빌어
    - 신전 왔으니 기도해
    - 축복 좀 빌어봐
    - 기도나 해두라고
    - 마음 담아 기도해
    - 조용히 기도 올려

- action: Dance
  mode: Lifestyle
  facial: [Happy, Neutral]
  target_kind: none
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.0, 0.1]
  extra_events:
    - 광장에 악사들이 연주를 시작함
    - 축제 첫날 밤
    - 선술집 분위기가 달아오름
    - 오랜 전쟁이 끝나 마을 전체가 들뜬 상태
    - 왕이 귀빈을 맞아 연회를 여는 중
    - 모닥불 주위에 동료들이 모여 흥을 돋우는 참
    - 행진이 시작되며 음악 소리가 커짐
    - 승리 기념 파티가 한창 무르익은 상태
  intents:
    - 춤춰
    - 한 곡 춤춰봐
    - 흥 좀 내봐, 춤춰
    - 음악 나오는데 춤 안 춰?
    - 다 같이 춤추자
    - 춤 한번 보여줘
    - 신나게 춤춰봐
    - 축제니까 춤춰
    - 몸 좀 흔들어봐
    - 춤추라고
    - 여기서 한 판 춰
    - 박자 맞춰 춤춰
    - 춤솜씨 좀 보자
    - 어울려서 춤춰

- action: Sing
  mode: Lifestyle
  facial: [Happy, Neutral]
  target_kind: none
  loc_kind: none
  item_kind: none
  style_kind: none
  danger: [0.0, 0.1]
  extra_events:
    - 모닥불 앞에 사람들이 둘러앉음
    - 뱃사람들이 노래를 청함
    - 여관 손님들이 조용해진 참
    - 길고 긴 여정에서 동료들의 사기를 돋울 필요가 있음
    - 어린이들이 노래를 듣고 싶어 주위에 모여듦
    - 연인과 마지막 밤을 보내는 애틋한 분위기
    - 마을 어르신이 옛 노래를 청하는 상황
    - 장례 의식에서 고인을 추모하는 노래가 필요한 상황
  intents:
    - 노래해
    - 노래 한 곡 불러봐
    - 그 노래 불러줘
    - 분위기 좀 살려, 노래해
    - 목소리 좋던데 불러봐
    - 뱃노래 한 소절 뽑아
    - 노래 좀 들려주시죠
    - 다들 듣고 싶어 해, 불러
    - 한 소절만 불러봐
    - 노래하라고
    - 조용하니까 노래나 해
    - 아까 그 곡 다시 불러
    - 흥얼거려 봐
    - 축가 한번 불러줘
