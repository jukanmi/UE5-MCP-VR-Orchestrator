# multi.yaml — 복합 액션 시나리오 스펙
# 하나의 발화에서 여러 액션이 자연스럽게 나오는 상황만 모음.
# multi_actions: 리스트 내 각 항목은 단일 액션 스펙 (action, target_kind, furniture_types, item_kind, loc_kind, style_kind).
# id 필드 필수 — gen_multi_{id}_{i:03d}_p{k} 형태로 사용됨.
# 규칙: action들 사이에 인과관계가 명확해야 함 (TurnTo→Comfort = "나 봐, 괜찮아?" 처럼).

# ─────────────────────────────────────────
# 1. 고개 돌려 + 위로
# ─────────────────────────────────────────
- id: turnto_comfort
  mode: Social
  facial: [Neutral, Happy]
  danger: [0.0, 0.1]
  extra_events:
    - 어깨가 축 처진 채 다른 곳을 바라보는 상태
    - 눈물을 숨기려 얼굴을 돌리고 있음
    - 실패 후 혼자 구석에 서 있는 상황
    - 대화 중 상대가 시선을 회피하는 참
    - 오랜 친구가 힘든 소식을 들은 직후
    - 어두운 표정으로 창밖만 바라보고 있음
    - 슬픈 소식을 전해 들은 후 말이 없어진 상태
    - 자책하며 고개를 숙이고 있는 상황
  multi_actions:
    - action: TurnTo
      target_kind: player
    - action: Comfort
      target_kind: player
  intents:
    - 이쪽 봐, 괜찮아
    - 나 좀 보세요, 다 잘 될 거예요
    - 얼굴 들고 나 봐, 힘내
    - 이쪽 봐봐, 너 잘못 아니야
    - 나를 보고 얘기해, 같이 이겨내자
    - 여기 봐, 너 혼자 아니야
    - 고개 들고 나 보세요, 다 괜찮을 거예요
    - 나 좀 봐, 토닥여줄게
    - 이쪽 봐서 표정 좀 봐, 다독여줄게
    - 나 보고 얘기해봐, 힘든 거 알아
    - 얼굴 들어, 같이 생각해보자
    - 눈 마주치고 얘기해, 괜찮아질 거야
    - 돌아봐, 혼자 둘 수 없어
    - 나한테 시선 줘, 많이 힘들지?

# ─────────────────────────────────────────
# 2. 멈춰 + 주변 살피기
# ─────────────────────────────────────────
- id: stop_scan
  mode: Common
  facial: [Neutral, Surprised]
  danger: [0.2, 0.6]
  extra_events:
    - 어디선가 수상한 소리가 들려옴
    - 인기척 같은 게 느껴지는 상태
    - 이상한 냄새가 갑자기 풍겨오는 참
    - 풀숲이 출렁이는 게 보임
    - 전진하다 갑작스런 소음에 발을 멈추는 상황
    - 어두운 골목에서 그림자가 움직인 것 같음
    - 순찰 중 예상치 못한 흔적을 발견한 순간
    - 적이 매복해 있을 수 있는 좁은 통로 앞
  multi_actions:
    - action: Stop
      target_kind: none
    - action: Scan
      target_kind: none
  intents:
    - 멈춰서 주변 좀 살펴봐
    - 잠깐 멈추고 둘러봐
    - 거기서 멈추고 주변 확인해
    - 스톱, 사방 좀 살펴봐
    - 잠깐 세워, 뭔가 있나 봐봐
    - 멈춰, 이상한 거 없는지 둘러봐
    - 그만 가고 주변 경계해
    - 멈춰서 사방 둘러보시죠
    - 잠깐 서서 주위 살펴봐
    - 스톱 하고 둘러봐
    - 잠깐만, 멈추고 확인해봐
    - 멈춰봐, 뭔가 있는 것 같아
    - 그 자리에 서서 살펴봐
    - 멈추고 귀 기울여봐

# ─────────────────────────────────────────
# 3. 나를 향해 + 아이템 건네기
# ─────────────────────────────────────────
- id: turnto_giveitem
  mode: Social
  facial: [Happy, Neutral]
  danger: [0.0, 0.1]
  extra_events:
    - 여행을 떠나기 전 마지막으로 챙겨줄 게 있는 상황
    - 보상으로 뭔가를 건네주려는 참
    - 오래된 물건을 특별한 사람에게 물려주는 장면
    - 창고 정리 중 쓸 만한 걸 발견한 상태
    - 상대가 필요한 물건을 갖고 있는 걸 알고 있음
    - 임무 완수의 보답으로 선물을 전달하는 상황
    - 길을 떠나는 동료에게 노자를 쥐여주려는 참
    - 작별 인사와 함께 유품을 넘기는 마지막 장면
  multi_actions:
    - action: TurnTo
      target_kind: player
    - action: GiveItem
      target_kind: player
      item_kind: inventory
  intents:
    - 나 봐, 이거 너 줄게
    - 이쪽 좀 봐봐, 이거 가져가
    - 여기 봐, 이거 받아
    - 나 보고 이거 받아
    - 얼굴 들고 이거 가져
    - 이쪽 봐요, 드릴 게 있어요
    - 나를 향해 봐, 선물이야
    - 나 봐봐, 이거 챙겨
    - 이쪽으로 봐, 이거 줄게
    - 나한테 시선 줘, 이거 받아야 해
    - 내 쪽 봐요, 이거 드릴게요
    - 이리 봐, 가져가라고
    - 나 봐서 이거 받아라
    - 돌아봐, 이게 네 거야

# ─────────────────────────────────────────
# 4. 아이템 사용 + 나를 향해 (전투 후 치료 장면)
# ─────────────────────────────────────────
- id: useitem_turnto
  mode: Common
  facial: [Tired, Neutral]
  danger: [0.1, 0.4]
  extra_events:
    - 전투 후 체력이 많이 소진된 상태
    - 부상으로 몸이 무거운 상황
    - 상태 이상에 걸려 즉각 처치가 필요한 참
    - 아직 위험 구역에 있어 방심할 수 없는 상황
    - 다음 전투 전에 만반의 준비를 해야 하는 상태
    - 독에 맞아 시간이 없는 긴박한 상황
    - 긴 추격전 끝에 지쳐서 잠깐 숨을 고르는 참
    - 치료 후 다시 행동을 재개할 준비를 하는 상태
  multi_actions:
    - action: UseItem
      target_kind: self
      item_kind: inventory
    - action: TurnTo
      target_kind: player
  intents:
    - 그거 마시고 나 봐
    - 얼른 써서 회복하고 이리 봐
    - 빨리 먹고 나한테 봐봐
    - 그거 쓰고 여기 봐
    - 마시고서 나 쳐다봐
    - 소지품 써서 낫고 이쪽 봐
    - 그거 꺼내 쓰고 나 봐봐
    - 빨리 회복하고 나 쳐다봐
    - 그거 써서 좀 낫고 이쪽 봐요
    - 아끼지 말고 쓰고 나 봐
    - 그걸 사용하고 이리 돌아봐
    - 써서 회복하고 나한테 눈 줘
    - 마시고 여기 시선 줘봐
    - 빨리 처치하고 이쪽으로 봐

# ─────────────────────────────────────────
# 5. 공격 + 도주 (전략적 후퇴)
# ─────────────────────────────────────────
- id: attack_flee
  mode: Combat
  facial: [Angry, Fear]
  danger: [0.6, 1.0]
  extra_events:
    - 이미 심각한 부상을 입은 채로 싸우는 상황
    - 적 수가 너무 많아 오래 버티기 어려운 상태
    - 시간을 벌기 위해 한 번 치고 빠져야 하는 전술
    - 지원군이 오기 전까지 도망치며 버텨야 하는 상황
    - 폭발물이 곧 터지는 상황에서 선제 타격 후 이탈
    - 포위망이 좁혀오기 전에 타격하고 빠져야 하는 순간
    - 공격이 통하면 도주로가 열리는 전술적 순간
    - 마지막 체력으로 일격을 가하고 살아남아야 하는 상황
  multi_actions:
    - action: Attack
      target_kind: enemy
    - action: Flee
      target_kind: none
  intents:
    - 한 번 치고 도망가
    - 공격하고 바로 빠져
    - 저거 한 대 치고 도망쳐
    - 공격 한 방 먹이고 뒤로 빠져
    - 타격하고 바로 후퇴해
    - 저 놈 치고 튀어
    - 일격 가하고 빠져라
    - 공격하고 즉시 물러나
    - 한 방 먹이고 도주해
    - 쳐서 길 만들고 도망가
    - 먼저 공격하고 재빨리 후퇴
    - 세게 치고 빠져서 살아남아
    - 타격 후 즉시 도망쳐
    - 공격하고 최대한 빨리 튀어

# ─────────────────────────────────────────
# 6. 대기 + 정찰 (척후 전술)
# ─────────────────────────────────────────
- id: wait_scout
  mode: Investigation
  facial: [Neutral, Surprised]
  danger: [0.1, 0.5]
  extra_events:
    - 이 길이 안전한지 먼저 확인이 필요한 상황
    - 아직 앞길을 파악하지 못해 신중해야 하는 상태
    - 전위대가 정찰하는 동안 기다려야 하는 참
    - 야영지를 꾸리기 전 주변을 살펴야 하는 상황
    - 적의 패트롤 타이밍을 파악해야 하는 침투 임무
    - 기다리면서 상황을 관찰해야 하는 전략적 순간
    - 신호를 기다리면서 주변을 경계해야 하는 상황
    - 선발대가 돌아올 때까지 자리를 지키는 상황
  multi_actions:
    - action: Wait
      target_kind: none
    - action: Scout
      target_kind: none
      loc_kind: point
  intents:
    - 거기서 기다리면서 주변 좀 정찰해봐
    - 대기하면서 앞쪽 살피고 와
    - 잠깐 서 있다가 저쪽 정찰해
    - 여기서 기다리되 주변 한 바퀴 둘러봐
    - 신호 줄 때까지 기다리면서 주변 확인해
    - 머물면서 앞쪽 한번 훑어봐
    - 그 자리 지키면서 주변 정찰해
    - 잠시 기다리고 저 구역 살피고 와
    - 대기하되 사방 한 번씩 둘러봐
    - 여기 있으면서 저쪽 좀 정찰하시죠
    - 잠깐 기다리다가 주변 한 바퀴 해줘
    - 서서 기다리면서 앞길 좀 확인해
    - 대기 중에 이 근방 한번 훑어봐
    - 기다리면서 이상한 거 없는지 돌아봐

# ─────────────────────────────────────────
# 7. 아이템 장착 + 공격 (전투 준비 → 즉시 공격)
# ─────────────────────────────────────────
- id: equip_attack
  mode: Combat
  facial: [Angry, Neutral]
  danger: [0.4, 0.9]
  extra_events:
    - 갑작스러운 적습에 손에 아무것도 없는 상태
    - 장비를 꺼내는 것과 동시에 공격해야 하는 긴박한 상황
    - 협상이 결렬되어 즉시 전투 태세에 들어가는 참
    - 매복에 걸려 재빠른 대응이 필요한 순간
    - 선제 타격을 위해 무장하는 동시에 돌진해야 하는 상황
    - 적이 먼저 무기를 뽑아드는 것을 보는 순간
    - 호위 대상이 위협을 받아 즉각 대응해야 하는 참
    - 기습 공격을 받아 방어적 반격을 해야 하는 상황
  multi_actions:
    - action: Equip
      target_kind: self
      item_kind: inventory
    - action: Attack
      target_kind: enemy
  intents:
    - 무기 들고 바로 공격해
    - 장착하고 즉시 쳐
    - 무기 꺼내서 바로 덤벼
    - 챙기자마자 공격해
    - 무장하고 저놈 잡아
    - 들고 바로 저놈 쳐
    - 무기 잡는 동시에 공격해
    - 꺼내서 즉시 써, 공격해
    - 무기 들고 저 적부터 처리해
    - 장비 갖추고 바로 쳐
    - 들자마자 달려들어서 쳐
    - 무장하고 저 녀석 쳐내
    - 무기 꺼내들고 공격하라고
    - 장착하는 동시에 저 놈 후려쳐

# ─────────────────────────────────────────
# 8. 물건 건네기 + 위로 (돌봄 복합)
# ─────────────────────────────────────────
- id: handobj_comfort
  mode: Social
  facial: [Neutral, Happy]
  danger: [0.0, 0.1]
  extra_events:
    - 상처를 입어 치료가 필요한 상태
    - 오랜 여정에 지쳐 체력이 바닥난 참
    - 슬픔에 빠진 상대를 달래야 하는 상황
    - 임무 실패 후 낙심한 동료 곁에 있는 참
    - 힘든 고백을 들은 후 위로의 손을 내미는 장면
    - 다친 손을 치료하면서 위로의 말을 건네는 상황
    - 떠나는 동료에게 마지막 선물과 함께 위로를 전하는 참
    - 아픈 사람에게 약을 건네며 곁에 있어주는 장면
  multi_actions:
    - action: HandObject
      target_kind: player
      item_kind: inventory
    - action: Comfort
      target_kind: player
  intents:
    - 이거 받고 힘내
    - 이걸 줄 테니 너무 자책하지 마
    - 받아, 그리고 괜찮아질 거야
    - 이거 건네줄게, 힘내요
    - 여기 있어, 그리고 걱정하지 마
    - 이거 가져가, 다 잘 될 거야
    - 이거 받고 기운 내
    - 줄게, 그리고 넌 잘못 없어
    - 이거 받아봐, 힘든 거 알아
    - 가져가, 네 곁에 있을게
    - 이걸 줄게, 혼자 아니야
    - 받아요, 다 괜찮아질 거예요
    - 이거 건네줄게, 같이 이겨내자
    - 가져가라, 마음 좀 풀어

# ─────────────────────────────────────────
# 9. 정찰 + 추적 (탐색 연계)
# ─────────────────────────────────────────
- id: scout_track
  mode: Investigation
  facial: [Neutral, Surprised]
  danger: [0.2, 0.6]
  extra_events:
    - 적이 어딘가로 도주한 것이 확인된 상황
    - 수상한 발자국이 이어지는 방향을 먼저 확인해야 하는 참
    - 정찰하다가 적의 흔적을 발견한 상황
    - 사냥감이 숨어있는 지역을 먼저 살펴야 하는 상태
    - 지형 파악 후 즉시 추적에 나서야 하는 참
    - 도주한 범인의 방향을 먼저 정찰로 확인하는 상황
    - 흔적이 이어지는 방향으로 정찰 후 추적해야 함
    - 탈출 경로 파악 후 뒤쫓아야 하는 상황
  multi_actions:
    - action: Scout
      target_kind: none
      loc_kind: point
    - action: Track
      target_kind: enemy
  intents:
    - 저 앞쪽 정찰하고 그놈 추적해
    - 먼저 살피고 발자국 쫓아
    - 주변 한번 훑고 흔적 따라가
    - 먼저 정찰하고 나서 쫓아봐
    - 앞길 파악하고 추적해
    - 살피고 나서 그놈 뒤쫓아
    - 지형 확인하고 흔적 쫓아가
    - 정찰 먼저 하고 그 자식 추적해
    - 주변 둘러보고 발자국 따라가
    - 훑어보고 나서 도망간 놈 쫓아
    - 지형 파악 후 즉시 추적해
    - 정찰 끝나면 바로 흔적 쫓아
    - 먼저 살피고 뒤쫓아서 잡아
    - 주변 보고 그놈 어딨는지 쫓아

# ─────────────────────────────────────────
# 10. 멈춰 + 아이템 장착 (위험 감지 → 준비)
# ─────────────────────────────────────────
- id: stop_equip
  mode: Common
  facial: [Neutral, Surprised]
  danger: [0.3, 0.7]
  extra_events:
    - 앞쪽에서 위험한 기척이 느껴지는 상황
    - 낯선 소리에 발을 멈추고 장비를 갖추는 참
    - 경비병이 나타나기 전에 준비가 필요한 상황
    - 매복 구역 직전에 이동을 멈추는 순간
