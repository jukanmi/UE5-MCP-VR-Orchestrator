    Skari는 마을의 핵심적인 자원인 석탄을 확보하고, 이를 합창실에 전달하는 임무를 수행해야 한다.
  gold:
    goal: "석탄을 수집하여 합창실로 운송하기"
    steps:
      - "사과 상인에게서 석탄을 획득하기"
      - "합창실로 이동하여 석탄을 전달하기"
      - "대장간으로 이동하여 추가적인 석탄 확보하기"
      - "숲의 텐트 구역에서 석탄 수집 및 검사 수행하기"

