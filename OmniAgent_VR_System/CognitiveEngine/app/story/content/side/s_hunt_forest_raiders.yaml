# 서브퀘스트 — b2_james_order 전이 시 해금. 남쪽 숲 도적 토벌 + 징표 회수.
# 완료 신호: BP_Enemy_Bandit 사망 드랍(DropItemID=BanditInsignia)을 플레이어가 주우면
# UE5 story_event {event: item_acquired, name: BanditInsignia} → 플래그 "item_acquired:BanditInsignia".
# BanditInsignia 는 Content/Data/Items/ItemRegistry.csv 의 실존 아이템 ID(도적단의 징표).
id: s_hunt_forest_raiders
title: 남쪽 숲의 도적
available_after: b2_james_order
summary: James 는 남쪽 숲에 자리 잡은 도적단이 상단 길목을 막고 있다며 처치를 부탁한다. 두목이 지닌 징표를 가져오면 토벌의 증거가 된다.
npc_goals:
  James: 남쪽 숲 도적단의 위치와 위험을 알려주고, 처치 증거로 도적단의 징표를 가져오라고 부탁한다
  Guard: 도적단 때문에 남쪽 길 순찰이 막혔다며 플레이어에게 조심하라고 경고한다
quest_log: 남쪽 숲의 도적을 처치하고 도적단의 징표를 회수하자
complete_when: {type: flag, name: "item_acquired:BanditInsignia"}
