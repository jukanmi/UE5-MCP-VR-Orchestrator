<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>TTS Voice Debug</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; padding: 24px; }
  h1 { font-size: 1.4rem; font-weight: 700; color: #7dd3fc; margin-bottom: 4px; }
  .subtitle { font-size: 0.8rem; color: #64748b; margin-bottom: 24px; }
  .section { background: #1e2330; border: 1px solid #2d3748; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .section-title { font-size: 1rem; font-weight: 600; color: #94a3b8; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 0.7rem; background: #1d4ed8; color: #bfdbfe; padding: 2px 8px; border-radius: 99px; }
  .badge.warn { background: #78350f; color: #fcd34d; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { text-align: left; padding: 8px 10px; color: #64748b; border-bottom: 1px solid #2d3748; font-weight: 500; }
  td { padding: 7px 10px; border-bottom: 1px solid #1a2035; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #252c3d; }
  input[type=number], input[type=text], textarea, select {
    background: #111827; border: 1px solid #374151; color: #e2e8f0;
    border-radius: 6px; padding: 4px 8px; font-size: 0.85rem; font-family: inherit;
  }
  input[type=number] { width: 80px; }
  input[type=text] { width: 100%; }
  textarea { width: 100%; min-height: 60px; resize: vertical; }
  button { cursor: pointer; border: none; border-radius: 6px; padding: 5px 12px; font-size: 0.8rem; font-weight: 600; transition: opacity 0.15s; }
  button:hover { opacity: 0.8; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-save  { background: #1d4ed8; color: #fff; }
  .btn-del   { background: #7f1d1d; color: #fca5a5; }
  .btn-add   { background: #064e3b; color: #6ee7b7; }
  .btn-play  { background: #312e81; color: #c7d2fe; }
  .btn-reload{ background: #1e293b; color: #94a3b8; border: 1px solid #374151; }
  .npc-card { background: #161b26; border: 1px solid #2d3748; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .npc-head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .npc-head strong { color: #7dd3fc; font-size: 1rem; }
  .npc-head label { font-size: 0.75rem; color: #64748b; display: flex; flex-direction: column; gap: 2px; }
  .npc-head input { width: 130px; }
  .ref-ok    { color: #4ade80; }
  .ref-miss  { color: #f87171; }
  .add-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: flex-end; }
  .add-row label { font-size: 0.75rem; color: #64748b; display: flex; flex-direction: column; gap: 4px; }
  .add-row input, .add-row select { width: 130px; }
  .toast { position: fixed; top: 20px; right: 20px; background: #1d4ed8; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
  .toast.err { background: #991b1b; }
  .preview-grid { display: grid; grid-template-columns: 1fr 1fr 2fr auto; gap: 10px; align-items: end; }
  .preview-grid label { font-size: 0.75rem; color: #64748b; display: flex; flex-direction: column; gap: 4px; }
  .meta-line { font-size: 0.75rem; color: #64748b; margin-top: 10px; }
  .hr { border-top: 1px dashed #2d3748; margin: 14px 0; }
</style>
</head>
<body>

<h1>TTS Voice Debug</h1>
<p class="subtitle">http://127.0.0.1:8001/debug — voice_map 편집 / 합성 미리듣기 / target SE 재추출</p>

<div class="toast" id="toast"></div>

<!-- ─── Preview ─────────────────────────────────────────── -->
<div class="section">
  <div class="section-title">
    미리듣기 합성
    <button class="btn-reload" onclick="loadAll()">↻ 새로고침</button>
    <button class="btn-reload" onclick="reloadVoices()">⟲ target SE 재추출</button>
  </div>
  <div class="preview-grid">
    <label>NPC<select id="pvNpc"></select></label>
    <label>감정<select id="pvEmotion"></select></label>
    <label>텍스트<input type="text" id="pvText" value="안녕하세요. 음성 테스트입니다."></label>
    <button class="btn-play" onclick="preview()">▶ 합성 재생</button>
  </div>
  <div class="meta-line" id="pvMeta">—</div>
  <audio id="pvAudio" controls style="width:100%; margin-top:10px; display:none;"></audio>
</div>

<!-- ─── voice_map ─────────────────────────────────────────── -->
<div class="section">
  <div class="section-title">
    voice_map.yaml
    <span class="badge" id="npcCount">—</span>
    <button class="btn-save" onclick="saveMap()">💾 저장 (재기동 시 적용)</button>
  </div>
  <div style="display:flex; gap:10px; align-items:flex-end; margin-bottom:14px;">
    <label style="font-size:0.75rem; color:#64748b; display:flex; flex-direction:column; gap:4px;">
      최상위 default ref
      <input type="text" id="topDefault" style="width:200px;">
    </label>
  </div>
  <div id="npcList"></div>
  <div class="add-row">
    <label>새 NPC AgentID<input type="text" id="newNpcId" placeholder="Guard_01"></label>
    <label>default_ref<input type="text" id="newNpcRef" placeholder="guard_male"></label>
    <label>lang<select id="newNpcLang"><option value="">auto</option><option value="KR">KR</option><option value="EN">EN</option></select></label>
    <label>speed<input type="number" id="newNpcSpeed" step="0.05" value="1.0"></label>
    <button class="btn-add" onclick="addNpc()">+ NPC 추가</button>
  </div>
</div>

<!-- ─── refs on disk ─────────────────────────────────────── -->
<div class="section">
  <div class="section-title">
    base_voices/ 디스크 상태
    <span class="badge" id="refCount">—</span>
  </div>
  <div class="meta-line" id="refsList">—</div>
  <div class="meta-line" id="cacheList">—</div>
</div>

<script>
let STATE = { map: {}, refs: new Set(), cached: new Set(), emotions: [] };

function showToast(msg, isErr=false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast" + (isErr ? " err" : "");
  t.style.opacity = "1";
  setTimeout(() => { t.style.opacity = "0"; }, 2200);
}

async function api(path, opts={}) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    const txt = await r.text().catch(() => "");
    throw new Error(`${r.status} ${txt}`);
  }
  return r;
}

function refMarker(ref) {
  return STATE.refs.has(ref)
    ? `<span class="ref-ok" title="base_voices/${ref}.wav 존재">●</span>`
    : `<span class="ref-miss" title="WAV 없음 — 첫 사용 시 자동 생성됨">○</span>`;
}

function emoOptions(selected) {
  return STATE.emotions.map(e =>
    `<option value="${e}"${e===selected?" selected":""}>${e}</option>`
  ).join("");
}

function renderNpcCard(npcId, npc) {
  const emotions = npc.emotions || {};
  const emoRows = Object.entries(emotions).map(([emo, entry]) => {
    const obj = (typeof entry === "string") ? { ref: entry } : (entry || {});
    return `<tr>
      <td><select onchange="updateEmotion('${npcId}','${emo}','key',this.value)">${emoOptions(emo)}</select></td>
      <td><input type="text" value="${obj.ref||""}" onchange="updateEmotion('${npcId}','${emo}','ref',this.value)"> ${refMarker(obj.ref||"")}</td>
      <td><input type="number" step="0.05" value="${obj.speed??""}" placeholder="(NPC speed)" onchange="updateEmotion('${npcId}','${emo}','speed',this.value)"></td>
      <td><button class="btn-del" onclick="delEmotion('${npcId}','${emo}')">✕</button></td>
    </tr>`;
  }).join("");

  return `<div class="npc-card">
    <div class="npc-head">
      <strong>${npcId}</strong>
      <label>default_ref<input type="text" value="${npc.default_ref||""}" onchange="updateNpc('${npcId}','default_ref',this.value)"></label>
      <label>lang
        <select onchange="updateNpc('${npcId}','lang',this.value)">
          <option value=""${!npc.lang?" selected":""}>auto</option>
          <option value="KR"${npc.lang==="KR"?" selected":""}>KR</option>
          <option value="EN"${npc.lang==="EN"?" selected":""}>EN</option>
        </select>
      </label>
      <label>speed<input type="number" step="0.05" value="${npc.speed??""}" placeholder="1.0" onchange="updateNpc('${npcId}','speed',this.value)"></label>
      <span style="flex:1"></span>
      <button class="btn-del" onclick="delNpc('${npcId}')">NPC 삭제</button>
    </div>
    <table>
      <thead><tr><th style="width:120px">감정</th><th>ref ${refMarker(npc.default_ref||"")}default</th><th style="width:120px">speed</th><th style="width:40px"></th></tr></thead>
      <tbody>${emoRows || `<tr><td colspan="4" style="color:#4b5563; text-align:center; padding:12px;">감정 entry 없음 — default_ref 만 사용</td></tr>`}</tbody>
    </table>
    <div class="add-row">
      <label>감정<select id="addEmo_${npcId}">${emoOptions("Neutral")}</select></label>
      <label>ref<input type="text" id="addRef_${npcId}" placeholder="${npc.default_ref||""}"></label>
      <label>speed<input type="number" step="0.05" id="addSpeed_${npcId}" placeholder="(NPC speed)"></label>
      <button class="btn-add" onclick="addEmotion('${npcId}')">+ emotion 추가</button>
    </div>
  </div>`;
}

function render() {
  document.getElementById("topDefault").value = STATE.map.default || "";
  const npcs = STATE.map.npcs || {};
  const ids = Object.keys(npcs);
  document.getElementById("npcCount").textContent = `${ids.length} NPC`;
  document.getElementById("npcList").innerHTML = ids.map(id => renderNpcCard(id, npcs[id]||{})).join("") || `<div style="color:#4b5563; text-align:center; padding:14px;">NPC 없음</div>`;

  // preview selectors
  const npcSel = document.getElementById("pvNpc");
  npcSel.innerHTML = ids.map(id => `<option value="${id}">${id}</option>`).join("");
  document.getElementById("pvEmotion").innerHTML = emoOptions("Neutral");

  // refs panel
  document.getElementById("refCount").textContent = `${STATE.refs.size} WAV`;
  document.getElementById("refsList").innerHTML = "디스크 ref: " + (
    [...STATE.refs].sort().map(r => `<span class="ref-ok">${r}</span>`).join(", ") || "(없음)"
  );
  document.getElementById("cacheList").innerHTML = "캐시된 target SE: " + (
    [...STATE.cached].sort().map(r => `<span class="ref-ok">${r}</span>`).join(", ") || "(없음)"
  );
}

async function loadAll() {
  try {
    const r = await api("/api/voice_map");
    const data = await r.json();
    // dict 도 yaml string 도 아닌 raw — 단축형 문자열 npc 는 dict 로 normalize
    const npcs = data.map.npcs || {};
    for (const id of Object.keys(npcs)) {
      if (typeof npcs[id] === "string") npcs[id] = { default_ref: npcs[id] };
    }
    STATE.map = data.map;
    STATE.refs = new Set(data.refs_on_disk || []);
    STATE.cached = new Set(data.cached_targets || []);
    STATE.emotions = data.known_emotions || [];
    render();
  } catch (e) {
    showToast("로드 실패: " + e.message, true);
  }
}

function updateNpc(id, key, val) {
  const npc = STATE.map.npcs[id] = STATE.map.npcs[id] || {};
  if (val === "" || val == null) delete npc[key];
  else if (key === "speed") npc[key] = parseFloat(val);
  else npc[key] = val;
}

function updateEmotion(npcId, emo, key, val) {
  const npc = STATE.map.npcs[npcId];
  if (!npc.emotions) npc.emotions = {};
  let entry = npc.emotions[emo];
  if (typeof entry === "string") entry = { ref: entry };
  if (!entry) entry = {};
  if (key === "key") {
    delete npc.emotions[emo];
    npc.emotions[val] = entry;
  } else if (val === "" || val == null) {
    delete entry[key];
    npc.emotions[emo] = entry;
  } else if (key === "speed") {
    entry.speed = parseFloat(val);
    npc.emotions[emo] = entry;
  } else {
    entry[key] = val;
    npc.emotions[emo] = entry;
  }
  render();
}

function addEmotion(npcId) {
  const emo = document.getElementById(`addEmo_${npcId}`).value;
  const ref = document.getElementById(`addRef_${npcId}`).value.trim();
  const speed = document.getElementById(`addSpeed_${npcId}`).value;
  const npc = STATE.map.npcs[npcId];
  if (!npc.emotions) npc.emotions = {};
  const entry = {};
  if (ref) entry.ref = ref;
  if (speed) entry.speed = parseFloat(speed);
  npc.emotions[emo] = entry;
  render();
}

function delEmotion(npcId, emo) {
  delete STATE.map.npcs[npcId].emotions[emo];
  render();
}

function addNpc() {
  const id = document.getElementById("newNpcId").value.trim();
  if (!id) { showToast("AgentID 필요", true); return; }
  if (!STATE.map.npcs) STATE.map.npcs = {};
  if (STATE.map.npcs[id]) { showToast("이미 존재", true); return; }
  const ref = document.getElementById("newNpcRef").value.trim();
  const lang = document.getElementById("newNpcLang").value;
  const speed = document.getElementById("newNpcSpeed").value;
  const npc = { default_ref: ref || id };
  if (lang) npc.lang = lang;
  if (speed) npc.speed = parseFloat(speed);
  npc.emotions = {};
  STATE.map.npcs[id] = npc;
  document.getElementById("newNpcId").value = "";
  document.getElementById("newNpcRef").value = "";
  render();
}

function delNpc(id) {
  if (!confirm(`${id} 삭제?`)) return;
  delete STATE.map.npcs[id];
  render();
}

async function saveMap() {
  STATE.map.default = document.getElementById("topDefault").value.trim() || STATE.map.default;
  try {
    await api("/api/voice_map", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ map: STATE.map }),
    });
    showToast("voice_map.yaml 저장 완료 — 'target SE 재추출' 또는 재기동으로 적용");
  } catch (e) {
    showToast("저장 실패: " + e.message, true);
  }
}

async function preview() {
  const npc = document.getElementById("pvNpc").value;
  const emo = document.getElementById("pvEmotion").value;
  const text = document.getElementById("pvText").value;
  if (!text.trim()) { showToast("텍스트 필요", true); return; }
  const meta = document.getElementById("pvMeta");
  meta.textContent = "합성 중...";
  try {
    const r = await api("/api/preview", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ text, npc_id: npc, emotion: emo }),
    });
    const ref = r.headers.get("X-Voice-Ref");
    const lang = r.headers.get("X-Voice-Lang");
    const speed = r.headers.get("X-Voice-Speed");
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const audio = document.getElementById("pvAudio");
    audio.src = url;
    audio.style.display = "block";
    audio.play();
    meta.textContent = `ref=${ref} lang=${lang} speed=${speed} (${Math.round(blob.size/1024)}KB)`;
  } catch (e) {
    meta.textContent = "실패: " + e.message;
    showToast("합성 실패: " + e.message, true);
  }
}

async function reloadVoices() {
  showToast("target SE 재추출 시작...");
  try {
    const r = await api("/api/reload_voices", { method: "POST" });
    const data = await r.json();
    showToast(`재추출 완료: ${data.extracted.length}개 (실패 ${data.failed.length})`);
    loadAll();
  } catch (e) {
    showToast("재추출 실패: " + e.message, true);
  }
}

loadAll();
</script>
</body>
</html>
